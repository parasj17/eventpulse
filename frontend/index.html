/* Transport load.
   The problem statement names congestion and last-mile connectivity alongside
   accommodation, and the link data is hourly. Until now it only surfaced as
   alerts and faint lines on the map, which understates half the problem. */
function TransportLoad({ links, zones, reroutes }) {
  if (!links.length) return null;

  // Zone ids mean nothing to an operator reading a control screen.
  const nameOf = Object.fromEntries((zones || []).map((z) => [z.id, z.name]));

  const busiest = [...links]
    .sort((a, b) => b.load_pct - a.load_pct)
    .slice(0, 4);

  const colour = (pct) =>
    pct >= 92 ? "var(--accent)" : pct >= 80 ? "var(--warn)" : "var(--good)";

  const hot = links.filter((l) => l.load_pct >= 80).length;

  return (
    <div className="sect">
      <span className="eyebrow">Last mile</span>
      <h3 className="display" style={{ marginTop: 7 }}>Transport Load</h3>
      <div className="lead">
        {hot > 0
          ? `${hot} of ${links.length} links above 80%`
          : `All ${links.length} links running clear`}
      </div>

      {busiest.map((l) => (
        <div className="link-row" key={l.link_id}>
          <div className="r1">
            <span className="rt">
              {nameOf[l.from_zone] || l.from_zone} to {nameOf[l.to_zone] || l.to_zone}
            </span>
            <span className="lv" style={{ color: colour(l.load_pct) }}>
              {l.load_pct.toFixed(0)}%
            </span>
          </div>
          <div className="track">
            <div className="fillbar"
                 style={{ width: `${Math.min(100, l.load_pct)}%`,
                          background: colour(l.load_pct) }} />
          </div>
          <div className="cap">
            {l.mode} · {l.current_load.toLocaleString()} of {l.capacity_per_hour.toLocaleString()} per hour
          </div>

          {/* What to do about it. A congested link with no answer underneath
              tells an operator nothing they cannot already see. */}
          {(() => {
            const r = reroutes?.[l.link_id];
            if (!r || r.verdict === "clear") return null;

            if (r.verdict === "no_relief") {
              return (
                <div className="alt">
                  <span>No alternative; every route out is saturated. Stagger departures.</span>
                </div>
              );
            }

            const b = r.best_alternative;
            return (
              <div className="alt relief">
                <span className="go">{b.label}</span>
                <span>{b.bottleneck_pct.toFixed(0)}%</span>
                <span className="cost">+{b.extra_minutes} min</span>
              </div>
            );
          })()}
        </div>
      ))}
    </div>
  );
}

/* Venue capacity.
   Everything else on this screen treats an event as a source of demand. This
   treats it as a building with doors and a seat count, which is a different
   constraint and fails in three different ways: too many tickets, gates too
   slow, or a network outside that cannot absorb the crowd at the end. */
// Colour + label for a gate's auto-computed state. This is never set by a
// click — it is derived server-side each tick from queue load (pre-event)
// or exit load (post-event), so the badge just reflects what the crowd is
// actually doing at this gate right now.
// Gates never pass 100% of capacity: busy (amber) from 75%, closed to new people (red)
// from 95%, with the overflow redirected to gates with room.
const GATE_WARN = 75, GATE_CLOSE = 95;
const GATE_LIVE = {
  open:       { label: "Open",   color: "var(--good)" },
  restricted: { label: "Busy",   color: "var(--warn, #d9a441)" },
  closed:     { label: "Closed", color: "var(--accent)" },
};
const gatePct = (g) => Math.min(100, g.load_pct != null ? g.load_pct : (g.load_ratio || 0) * 100);
const gateColor = (pct) => (pct >= GATE_CLOSE ? "var(--accent)" : pct >= GATE_WARN ? "var(--warn, #d9a441)" : "var(--good)");

function ExitRedirect({ zoneId, hour, staticData }) {
  const [rec, setRec] = useState(null);

  useEffect(() => {
    if (!zoneId) return;

    if (staticData) {
      setRec(staticData[zoneId] || null);
      return;
    }

    let cancelled = false;
    fetch(`${API}/exit-redirect/${zoneId}?hour=${hour}`)
      .then((r) => r.json())
      .then((d) => { if (!cancelled) setRec(d); })
      .catch(() => {});
    return () => { cancelled = true; };
  }, [zoneId, hour, staticData]);

  if (!rec?.options?.length) return null;

  return (
    <div style={{ marginTop: 16 }}>
      <span className="eyebrow dim">Recommended exit &mdash; {zoneId}</span>
      <div style={{ display: "flex", flexDirection: "column", gap: 6, marginTop: 6 }}>
        {rec.options.map((o, i) => {
          const live = GATE_LIVE[o.live_status] || GATE_LIVE.open;
          return (
            <div key={o.gate_id} className={`exit-opt${i === 0 ? " best" : ""}`}>
              <div>
                <div className="exit-name">{i + 1}. {o.name}</div>
                <div className="exit-why">{o.reason}</div>
              </div>
              <span className="exit-status" style={{ color: live.color }}>{live.label}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function GatePanel({ zoneId, gates, held }) {
  if (!gates?.length) return null;
  const flowing = gates.some((g) => g.phase && g.phase !== "idle");

  return (
    <div style={{ marginTop: 16 }}>
      <span className="eyebrow dim">Gates · live, automatic · busy from {GATE_WARN}%, close at {GATE_CLOSE}%</span>
      {held > 0 && (
        <div className="gate-held">Every gate is at capacity: {held.toLocaleString()} people are being held back and asked to wait.</div>
      )}
      <div className="gate-list">
        {gates.map((g) => {
          const live = GATE_LIVE[g.live_status] || GATE_LIVE.open;
          const oos = g.status && g.status !== "open";
          const pct = gatePct(g);
          return (
            <div key={g.gate_id} className="gate-row">
              <div className="gate-top">
                <b>{g.name}</b>
                <span className="gate-pct" style={{ color: flowing && !oos ? gateColor(pct) : "var(--ink-faint)" }}>
                  {oos ? "out of service" : flowing && g.phase !== "idle" ? `${Math.round(pct)}%` : "idle"}
                </span>
                <span className="gate-badge" style={{ background: oos ? "#444" : live.color }}>{oos ? "Out of service" : live.label}</span>
              </div>
              {g.phase !== "idle" && !oos && (
                <div className="gate-bar" aria-hidden="true">
                  <i style={{ width: `${pct}%`, background: gateColor(pct) }} />
                  <em style={{ left: `${GATE_WARN}%` }} /><em style={{ left: `${GATE_CLOSE}%` }} />
                </div>
              )}
              <div className="note">
                {g.phase === "ingress" ? "Letting people in" : g.phase === "egress" ? "Letting people out" : "No crowd right now"}
                {" \u00B7 "}in {g.entry_capacity_per_hour.toLocaleString()}/h, out {g.exit_capacity_per_hour.toLocaleString()}/h
                {g.demand_pct > 100 ? ` \u00B7 demand ${Math.round(g.demand_pct)}% of capacity` : ""}
              </div>
              {g.redirect_to && g.redirect_to.length > 0 && (
                <div className="gate-redirect out">
                  Closed at {GATE_CLOSE}% &middot; sending {g.redirected_out.toLocaleString()} people to{" "}
                  {g.redirect_to.map((t) => `${t.name} (${t.people.toLocaleString()})`).join(", ")}
                </div>
              )}
              {g.redirect_from && g.redirect_from.length > 0 && (
                <div className="gate-redirect in">
                  +{g.redirected_in.toLocaleString()} redirected from {g.redirect_from.map((t) => t.name).join(", ")}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* Floor density.
   The venue drawn as a floor: its footprint (or the organiser's uploaded plan), a heat
   glow per area sized by capacity and coloured by how full it is, each gate where it
   really is with its live state, and a flow line from gate to concourse that runs
   inward while people arrive and outward while they leave. Colours follow the density
   engine's own thresholds: at capacity is amber, twice capacity is critical. */
const HEAT_STOPS = [[0, [0, 196, 106]], [60, [0, 196, 106]], [75, [232, 163, 61]], [95, [255, 59, 31]], [100, [255, 59, 31]]];
function heat(pct, alpha = 1) {
  const p = Math.max(0, Math.min(100, pct));
  let i = 0;
  while (i < HEAT_STOPS.length - 2 && p > HEAT_STOPS[i + 1][0]) i++;
  const [p0, c0] = HEAT_STOPS[i], [p1, c1] = HEAT_STOPS[i + 1];
  const t = (p - p0) / (p1 - p0);
  const c = c0.map((v, k) => Math.round(v + (c1[k] - v) * t));
  return `rgba(${c[0]},${c[1]},${c[2]},${alpha})`;
}

function FloorDensity({ zoneId, hour, staticData, gates }) {
  const [zones, setZones] = useState([]);
  const [plan, setPlan] = useState(null);       // { url, aspect } when the organiser uploaded one
  const [hover, setHover] = useState(null);

  useEffect(() => {
    if (!zoneId) return;
    // On a static deploy there is no live API to fetch from; the hour bundle
    // already carries this venue's density, precomputed.
    if (staticData) { setZones(staticData[zoneId] || []); return; }
    let cancelled = false;
    fetch(`${API}/density/${zoneId}?hour=${hour}`)
      .then((r) => r.json())
      .then((d) => { if (!cancelled) setZones(d || []); })
      .catch(() => {});
    return () => { cancelled = true; };
  }, [zoneId, hour, staticData]);

  useEffect(() => {
    setPlan(null);
    if (!zoneId || STATIC_MODE) return;
    const img = new Image();
    const url = `${API}/organizer/venues/${zoneId}/map`;
    img.onload = () => setPlan({ url, aspect: img.naturalWidth / img.naturalHeight });
    img.onerror = () => {};
    img.src = url;
  }, [zoneId]);

  if (!zones.length) return null;

  const gateById = Object.fromEntries((gates || []).map((g) => [g.gate_id, g]));
  const total = zones.reduce((s, z) => s + z.people_count, 0);
  const ranked = [...zones].sort((a, b) => b.occupancy_pct - a.occupancy_pct);
  const maxCap = Math.max(...zones.map((z) => z.capacity));
  const phase = (gates || []).find((g) => g.phase && g.phase !== "idle")?.phase;
  // One curve per (closed gate -> receiving gate), bowed outward from the centre of the
  // floor so it runs round the venue rather than across the pitch.
  const gateXY = Object.fromEntries((gates || []).map((g) => [g.gate_id, { x: g.x, y: g.y, name: g.name }]));
  const maxMove = Math.max(1, ...(gates || []).flatMap((g) => (g.redirect_to || []).map((t) => t.people)));
  const redirects = (gates || []).flatMap((g) => (g.redirect_to || []).filter((t) => gateXY[t.gate_id]).map((t) => {
    const a = gateXY[g.gate_id], b = gateXY[t.gate_id];
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    let dx = mx - 50, dy = my - 52;
    const len = Math.hypot(dx, dy);
    if (len < 6) { dx = -(b.y - a.y); dy = b.x - a.x; }
    const n = Math.hypot(dx, dy) || 1;
    const c = { x: mx + (dx / n) * 22, y: my + (dy / n) * 22 };
    const m = { x: 0.25 * a.x + 0.5 * c.x + 0.25 * b.x, y: 0.25 * a.y + 0.5 * c.y + 0.25 * b.y };
    const clampP = (p) => ({ x: Math.max(4, Math.min(96, p.x)), y: Math.max(4, Math.min(96, p.y)) });
    return { key: `${g.gate_id}-${t.gate_id}`, a, b, c, m: clampP(m), people: t.people, to: t.name, share: t.people / maxMove };
  }));
  const aspect = plan ? plan.aspect : 16 / 10;
  // Any area at 95% or more: send people to the nearest gate they can use, drawn as an arrow
  // from the area to that gate. Prefer gates open to people; if every gate is shut to new
  // arrivals (mid-event), the nearest working gate is still the way out.
  const usable = (gates || []).filter((g) => !(g.status && g.status !== "open"));
  const openG = usable.filter((g) => g.live_status !== "closed");
  const pool = openG.length ? openG : usable;
  const dist = (a, b) => Math.hypot((a.x - b.x) * aspect, a.y - b.y);
  const guides = pool.length ? zones.filter((z) => z.occupancy_pct >= GATE_CLOSE).map((z) => {
    const g = pool.slice().sort((a, b) => dist(z, a) - dist(z, b))[0];
    const ang = Math.atan2(g.y - z.y, (g.x - z.x) * aspect) * 180 / Math.PI;
    const tip = { x: z.x + (g.x - z.x) * 0.86, y: z.y + (g.y - z.y) * 0.86 };
    const mid = { x: z.x + (g.x - z.x) * 0.5, y: z.y + (g.y - z.y) * 0.5 };
    return { key: z.floor_zone_id, zone: z, gate: g, ang, tip, mid };
  }) : [];
  const guideFor = Object.fromEntries(guides.map((d) => [d.zone.floor_zone_id, d]));

  return (
    <div className="fd">
      <div className="fd-head">
        <span className="eyebrow dim">Floor density · live</span>
        <span className="fd-sum">
          <b>{total.toLocaleString()}</b> people inside
          {phase ? <> · <span className={`fd-phase ${phase}`}>{phase === "ingress" ? "Arriving" : "Leaving"}</span></> : null}
        </span>
      </div>

      <div className="fd-layout">
        <div className={`fd-floor${plan ? "" : " schem"}`} style={{ aspectRatio: String(aspect) }} onMouseLeave={() => setHover(null)}>
          {plan
            ? <img className="fd-plan" src={plan.url} alt="" draggable="false" />
            : (
              <svg className="fd-site" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
                <defs>
                  <pattern id="fdgrid" width="5" height="5" patternUnits="userSpaceOnUse">
                    <path d="M5 0H0V5" fill="none" stroke="rgba(255,255,255,.035)" strokeWidth="0.3" vectorEffect="non-scaling-stroke" />
                  </pattern>
                </defs>
                <rect width="100" height="100" fill="url(#fdgrid)" />
                <ellipse cx="50" cy="52" rx="44" ry="42" fill="rgba(255,255,255,.025)" stroke="rgba(255,255,255,.16)" strokeWidth="1.5" vectorEffect="non-scaling-stroke" />
                <ellipse cx="50" cy="52" rx="33" ry="30" fill="none" stroke="rgba(255,255,255,.07)" strokeWidth="1" strokeDasharray="4 4" vectorEffect="non-scaling-stroke" />
              </svg>
            )}

          {/* heat: one soft glow per area, sized by capacity, coloured by occupancy */}
          {zones.map((z) => {
            const d = (z.kind === "bowl" ? 58 : 20 + 16 * Math.sqrt(z.capacity / maxCap));
            const a = 0.25 + 0.55 * Math.min(1, z.occupancy_pct / 120);
            return (
              <div key={`h-${z.floor_zone_id}`} className="fd-heat"
                   style={{ left: `${z.x}%`, top: `${z.y}%`, width: `${d}%`,
                            background: `radial-gradient(closest-side, ${heat(z.occupancy_pct, a)}, ${heat(z.occupancy_pct, a * 0.35)} 55%, transparent)` }} />
            );
          })}

          {/* flow lines between each concourse and its gate */}
          <svg className="fd-flow" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
            {zones.filter((z) => z.kind !== "bowl").map((z) => {
              const g = gateById[z.floor_zone_id.replace(/-CONCOURSE$/, "")];
              if (!g) return null;
              const live = GATE_LIVE[g.live_status] || GATE_LIVE.open;
              const moving = g.phase && g.phase !== "idle";       // people are coming through, queue or not
              // Ingress runs gate -> concourse, egress concourse -> gate.
              const [x1, y1, x2, y2] = g.phase === "egress" ? [z.x, z.y, g.x, g.y] : [g.x, g.y, z.x, z.y];
              return (
                <line key={`f-${z.floor_zone_id}`} x1={x1} y1={y1} x2={x2} y2={y2}
                      className={moving ? "moving" : ""} stroke={live.color}
                      strokeWidth={moving ? 2 + Math.min(3, g.load_ratio * 3) : 1.2}
                      strokeOpacity={moving ? 0.9 : 0.35} vectorEffect="non-scaling-stroke" />
              );
            })}
          </svg>

          {/* redirected crowd: from each closed gate, round the outside to the gates taking its overflow */}
          {redirects.length > 0 && (
            <svg className="fd-redir" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
              {redirects.map((r) => (
                <path key={r.key} d={`M ${r.a.x} ${r.a.y} Q ${r.c.x} ${r.c.y} ${r.b.x} ${r.b.y}`} fill="none"
                      stroke="#FF3B1F" strokeWidth={1.5 + 4 * r.share} strokeLinecap="round" vectorEffect="non-scaling-stroke" />
              ))}
            </svg>
          )}
          {redirects.map((r) => (
            <div key={`l-${r.key}`} className="fd-redir-lbl" style={{ left: `${r.m.x}%`, top: `${r.m.y}%` }}>
              {r.people.toLocaleString()} &rarr; {r.to}
            </div>
          ))}

          {/* too full: the way to the nearest usable gate */}
          {guides.length > 0 && (
            <svg className="fd-guide" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
              {guides.map((d) => (
                <line key={d.key} x1={d.zone.x} y1={d.zone.y} x2={d.tip.x} y2={d.tip.y}
                      stroke="#4DA3FF" strokeWidth="3.5" strokeLinecap="round" vectorEffect="non-scaling-stroke" />
              ))}
            </svg>
          )}
          {guides.map((d) => (
            <React.Fragment key={`g-${d.key}`}>
              <div className="fd-guide-head" style={{ left: `${d.tip.x}%`, top: `${d.tip.y}%`, transform: `translate(-50%, -50%) rotate(${d.ang}deg)` }} />
              <div className="fd-guide-lbl" style={{ left: `${d.mid.x}%`, top: `${d.mid.y}%` }}>
                {d.zone.name.replace(/ Concourse$/, "")} full &rarr; use {d.gate.name}
              </div>
            </React.Fragment>
          ))}

          {/* areas */}
          {zones.map((z) => (
            <button key={z.floor_zone_id} type="button"
                    className={`fd-zone ${z.kind}${hover === z.floor_zone_id ? " on" : ""}`}
                    style={{ left: `${z.x}%`, top: `${z.y}%`, borderColor: heat(z.occupancy_pct), boxShadow: `0 0 18px ${heat(z.occupancy_pct, 0.35)}` }}
                    onMouseEnter={() => setHover(z.floor_zone_id)} onFocus={() => setHover(z.floor_zone_id)} onBlur={() => setHover(null)}
                    aria-label={`${z.name}: ${z.people_count.toLocaleString()} of ${z.capacity.toLocaleString()} people, ${z.occupancy_pct}%`}>
              <span className="nm">{z.name.replace(/ Concourse$/, "")}</span>
              <span className="pc" style={{ color: heat(z.occupancy_pct) }}>{Math.round(z.occupancy_pct)}%</span>
              <span className="pp">{z.people_count.toLocaleString()} / {z.capacity.toLocaleString()}</span>
            </button>
          ))}

          {/* gates */}
          {(gates || []).map((g, i) => {
            const live = GATE_LIVE[g.live_status] || GATE_LIVE.open;
            const oos = g.status && g.status !== "open";
            return (
              <div key={g.gate_id} className={`fd-gate${oos ? " oos" : ""}`}
                   style={{ left: `${g.x}%`, top: `${g.y}%`, background: oos ? "#444" : (g.phase !== "idle" ? gateColor(gatePct(g)) : live.color) }}
                   title={`${g.name}: ${oos ? "out of service" : live.label.toLowerCase()}${g.phase !== "idle" ? `, ${Math.round(gatePct(g))}% of capacity` : ""}`}>
                {i + 1}
                {g.phase !== "idle" && !oos && <span className="fd-gpct" style={{ color: gateColor(gatePct(g)) }}>{Math.round(gatePct(g))}%</span>}
              </div>
            );
          })}
        </div>

        <div className="fd-list">
          {ranked.map((z) => (
            <div key={z.floor_zone_id} className={`fd-row${hover === z.floor_zone_id ? " on" : ""}`}
                 onMouseEnter={() => setHover(z.floor_zone_id)} onMouseLeave={() => setHover(null)}>
              <div className="fd-row-top">
                <span>{z.name}</span>
                <b style={{ color: heat(z.occupancy_pct) }}>{Math.round(z.occupancy_pct)}%</b>
              </div>
              <div className="fd-bar"><i style={{ width: `${Math.min(100, z.occupancy_pct)}%`, background: heat(z.occupancy_pct) }} /></div>
              <div className="fd-row-sub">{z.people_count.toLocaleString()} of {z.capacity.toLocaleString()}{z.severity !== "ok" ? ` \u00B7 ${z.severity === "critical" ? "critical" : "busy"}` : ""}</div>
              {guideFor[z.floor_zone_id] && (
                <div className="fd-row-go">Over {GATE_CLOSE}%: send people to {guideFor[z.floor_zone_id].gate.name}, the nearest gate</div>
              )}
            </div>
          ))}
          <div className="fd-legend">
            <div className="fd-scale" />
            <div className="fd-scale-l"><span>Empty</span><span>{GATE_WARN}% busy</span><span>{GATE_CLOSE}% closes</span></div>
            <div className="fd-keys">
              <span><i style={{ background: GATE_LIVE.open.color }} />Open</span>
              <span><i style={{ background: GATE_LIVE.restricted.color }} />Busy</span>
              <span><i style={{ background: GATE_LIVE.closed.color }} />Closed</span>
              <span><i className="redir-key" />Redirected crowd</span>
              <span><i className="guide-key" />Too full: way to nearest gate</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function VenueFloor({ venues, hour, precomputed }) {
  if (!venues?.length) return null;

  // Whatever is happening now, or next. A finished event is history.
  const live = venues.find((v) => hour >= v.start_hour && hour <= v.end_hour);
  const next = venues
    .filter((v) => v.start_hour > hour)
    .sort((a, b) => a.start_hour - b.start_hour)[0];
  // An event whose gates are busy (people arriving, or leaving after it ends) matters
  // more than one that is only scheduled: the crowd is physically there.
  const busy = venues.find((x) => (x.gates || []).some((g) => g.phase && g.phase !== "idle"));
  const v = busy || live || next || venues[venues.length - 1];
  if (!v) return null;

  const running = live && live.event_id === v.event_id;
  const emptying = !running && hour > v.end_hour;

  return (
    <div className="card navsec" id="venue-section">
      <div className="card-head">
        <h3 className="display">Venue Floor</h3>
        <span className="meta">
          {running ? "Underway" : emptying ? "Ended · emptying out" : `Starts in ${v.start_hour - hour}h`}
        </span>
      </div>

      <div style={{ padding: "12px 18px 18px" }}>
        <div className="vrow">
          <div>
            <div className="vname">{v.name}</div>
            <div className="vsub">{v.venue_name}</div>
          </div>
        </div>

        <GatePanel zoneId={v.zone_id} gates={v.gates} held={v.gates_held || 0} />
        <FloorDensity zoneId={v.zone_id} hour={hour} staticData={precomputed?.density} gates={v.gates} />
        <ExitRedirect zoneId={v.zone_id} hour={hour} staticData={precomputed?.exitRedirect} />
      </div>
    </div>
  );
}

/* Weather twin.
   Live weather and public reports, pushed through the learned model of how weather
   moves through the city (engine/weather_twin.py), with quick what-ifs. The full,
   interactive version with the storm on the map lives in the twin (?weather=whatif). */
const WX_QUICK = [
  { label: "Heavy monsoon", body: { rain_mm_h: 25, duration_h: 3, temp_c: 27, wind_kmh: 35 } },
  { label: "Cloudburst", body: { rain_mm_h: 80, duration_h: 2, temp_c: 26, wind_kmh: 45, center: { zone_id: "Z04" }, radius_km: 3 } },
  { label: "Heatwave", body: { rain_mm_h: 0, duration_h: 5, temp_c: 44, wind_kmh: 12 } },
  { label: "Cyclone", body: { rain_mm_h: 45, duration_h: 6, temp_c: 27, wind_kmh: 110 } },
];

function WxRange({ q, fmt }) {
  return <span className="wx-range">likely {fmt(q.p10)}&ndash;{fmt(q.p90)}</span>;
}

function WxEffects({ list }) {
  const title = { 1: "Weather hits places", 2: "The network responds", 3: "People and businesses" };
  let last = 0;
  return (
    <div className="wx-fx">
      {list.map((e) => {
        const head = e.order !== last ? <div className="wx-ord" key={`h${e.order}`}>{e.order}{["st", "nd", "rd"][e.order - 1]} order &middot; {title[e.order]}</div> : null;
        last = e.order;
        return (
          <React.Fragment key={e.id}>
            {head}
            <div className={`wx-e o${e.order}${e.kind === "summary" ? " sum" : ""}`}>{e.text}</div>
          </React.Fragment>
        );
      })}
    </div>
  );
}

function PlanBox({ plan }) {
  if (!plan) return <div className="wx-sub" style={{ marginTop: 8 }}>Writing the operator plan...</div>;
  const nugen = plan.source === "nugen";
  return (
    <div className="plan-box">
      <div className="plan-head">
        <span className="eyebrow dim">Operator plan</span>
        <span className={`plan-src${nugen ? " nugen" : ""}`}
              title={nugen ? "" : (plan.rejected ? `The aligned model's answer wasn't used: ${plan.rejected}` : "The Nugen-aligned model isn't configured on this server.")}>
          {nugen ? `EventPulse model on Nugen${plan.confidence != null ? ` \u00B7 ${Math.round(plan.confidence)}% confident` : ""}` : "EventPulse playbook"}
        </span>
      </div>
      <ol>{plan.actions.map((a, i) => <li key={i}>{a}</li>)}</ol>
      {plan.attendee_message && <div className="plan-msg">Attendee message: {plan.attendee_message}</div>}
    </div>
  );
}

function WeatherTwin({ hour }) {
  const [plan, setPlan] = useState(null);
  const [simPlan, setSimPlan] = useState(null);
  const [st, setSt] = useState(null);
  const [social, setSocial] = useState(null);
  const [err, setErr] = useState("");
  const [sim, setSim] = useState(null);
  const [simBusy, setSimBusy] = useState("");
  const hourRef = React.useRef(hour);
  hourRef.current = hour;

  const load = useCallback(async () => {
    try {
      const [a, b] = await Promise.all([
        fetch(`${API}/weather-twin/state?hour=${hourRef.current}`).then((r) => (r.ok ? r.json() : Promise.reject())),
        fetch(`${API}/weather/social`).then((r) => (r.ok ? r.json() : null)).catch(() => null),
      ]);
      setSt(a); setSocial(b); setErr("");
      fetch(`${API}/ai/plan?hour=${hourRef.current}`).then((r) => (r.ok ? r.json() : null)).then(setPlan).catch(() => {});
    } catch (e) { setErr("The weather twin needs the live API (see DEPLOY.md)."); }
  }, []);

  useEffect(() => {
    if (STATIC_MODE) { setErr("The weather twin needs the live API. Run the backend to see live weather and what-ifs."); return undefined; }
    load();
    const id = setInterval(load, 60000);
    return () => clearInterval(id);
  }, [load]);
  // The clock moves every few seconds; follow it, but not on every tick.
  useEffect(() => {
    if (STATIC_MODE) return undefined;
    const t = setTimeout(() => { load(); setSim(null); }, 1500);
    return () => clearTimeout(t);
  }, [hour, load]);

  const runQuick = async (q) => {
    setSimBusy(q.label);
    try {
      const r = await fetch(`${API}/weather-twin/simulate`, { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...q.body, hour, baseline: "live" }) });
      const d = await r.json();
      setSim(r.ok ? { label: q.label, d } : null);
      if (!r.ok) setErr(d.detail || "The simulation failed.");
      setSimPlan(null);
      if (r.ok) fetch(`${API}/weather-twin/plan`, { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...q.body, hour, baseline: "live" }) }).then((x) => (x.ok ? x.json() : null)).then(setSimPlan).catch(() => {});
    } catch (e) { setErr("Couldn't reach the API to simulate."); }
    setSimBusy("");
  };

  const live = st && st.live;
  const c = live && live.available ? live.city : null;
  const fx = st ? st.effects.filter((e) => !e.folded) : [];
  const counts = social && social.available ? social.counts_24h : null;
  const n = (v) => Math.round(v).toLocaleString();

  return (
    <div className="card navsec" id="weather-section">
      <div className="card-head">
        <h3 className="display">Weather Twin</h3>
        <a className="meta" href={`twin.html?hour=${hour}&weather=whatif`} target="_blank" rel="noopener">What-if on the map &#8599;</a>
      </div>
      <div className="wx-body">
        {err && !st ? <div className="empty">{err}</div> : !st ? <div className="empty">Reading the live weather...</div> : (
          <>
            <div className="wx-top">
              <div className="wx-now">
                <span className="eyebrow dim">Now &middot; {live.source || "Open-Meteo"}</span>
                {c ? (
                  <>
                    <div className="wx-t"><b>{Math.round(c.temp_c)}&deg;</b> {c.condition}</div>
                    <div className="wx-sub">Feels like {Math.round(c.apparent_c)}&deg; &middot; rain {c.rain_mm_h_max} mm/h &middot; next 6 h {c.rain_next_6h_mm_max} mm ({Math.round(c.max_prob_next_6h)}%) &middot; gusts {Math.round(c.gust_kmh_max)} km/h</div>
                  </>
                ) : <div className="wx-sub">{live.error || "Live weather unavailable"}: assuming calm.</div>}
              </div>
              <div className="wx-now">
                <span className="eyebrow dim">Public reports &middot; last 24 h</span>
                {counts ? (
                  <div className="wx-chips">
                    {[["flooding", "Flooding"], ["transport", "Transport"], ["alert", "Alerts"], ["heat", "Heat"]].map(([k, t]) =>
                      <span key={k} className={counts[k] ? "on" : ""}>{t} {counts[k] || 0}</span>)}
                  </div>
                ) : <div className="wx-sub">Couldn't reach Mastodon or Google News.</div>}
                {social && social.items && social.items[0] && (
                  <div className="wx-latest">
                    Latest: {social.items[0].text.slice(0, 110)}{social.items[0].text.length > 110 ? "..." : ""}
                  </div>
                )}
              </div>
            </div>

            <span className="eyebrow dim" style={{ display: "block", marginTop: 16 }}>What today's weather is doing, vs a normal day</span>
            {fx.length ? <WxEffects list={fx.slice(0, 5)} /> :
              <div className="wx-sub" style={{ marginTop: 6 }}>Nothing measurable: the weather isn't changing how the city moves right now.</div>}
            <PlanBox plan={plan} />

            <span className="eyebrow dim" style={{ display: "block", marginTop: 18 }}>What if? Simulated on a copy, compared with now</span>
            <div className="wx-quick">
              {WX_QUICK.map((q) => (
                <button key={q.label} className={sim && sim.label === q.label ? "on" : ""} onClick={() => runQuick(q)} disabled={!!simBusy}>
                  {simBusy === q.label ? "Simulating..." : q.label}
                </button>
              ))}
            </div>
            {sim && (
              <div className="wx-sim">
                <div className="wx-kpis">
                  <div><small>Visitors stranded</small><b>{n(sim.d.city.stranded.p50)}</b><WxRange q={sim.d.city.stranded} fmt={n} /></div>
                  {sim.d.venue && <div><small>{sim.d.venue.venue_name} empties in</small><b>{sim.d.venue.hours_to_clear.p50.toFixed(1)} h</b>
                    <WxRange q={sim.d.venue.hours_to_clear} fmt={(v) => `${v.toFixed(1)} h`} /></div>}
                  <div><small>Worst flood risk</small><b>{Math.round(sim.d.city.max_flood_pct.p50)}%</b><WxRange q={sim.d.city.max_flood_pct} fmt={(v) => `${Math.round(v)}%`} /></div>
                  <div><small>Links cut to 60% or less</small><b>{Math.round(sim.d.city.links_disrupted.p50)}</b><WxRange q={sim.d.city.links_disrupted} fmt={(v) => String(Math.round(v))} /></div>
                </div>
                <PlanBox plan={simPlan} />
                <WxEffects list={sim.d.effects.filter((e) => !e.folded).slice(0, 8)} />
                <div className="wx-sub" style={{ marginTop: 8 }}>{sim.d.draws} simulated runs; &ldquo;likely&rdquo; is the 10th&ndash;90th percentile. The live system is not changed.</div>
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

/* Nugen connection, checked live by the server (GET /ai/nugen/verify). Shows only
   what Nugen actually confirmed for this deployment's key. */
function NugenBadge() {
  const [v, setV] = useState(null);
  useEffect(() => {
    if (STATIC_MODE) return undefined;
    const load = () => fetch(`${API}/ai/nugen/verify`).then((r) => (r.ok ? r.json() : null)).then(setV).catch(() => {});
    load();
    const id = setInterval(load, 300000);
    return () => clearInterval(id);
  }, []);
  if (!v || !v.has_key) return null;
  const ok = v.accepted === true;
  const title = ok
    ? `Nugen confirmed this server's API key (${v.key}) ${new Date(v.checked_at * 1000).toLocaleTimeString()}.`
      + (v.documents ? ` Documents on Nugen: ${v.documents.map((d) => `${d.name} ${d.status}`).join(", ")}.` : "")
      + (v.benchmark ? ` Benchmark ${v.benchmark.status} (${v.benchmark.samples} samples).` : "")
      + (v.alignment ? ` Latest alignment: ${v.alignment.status}.` : "")
    : (v.reason || "Couldn't confirm the key with Nugen just now.");
  return (
    <a className={`nugen-badge${ok ? " ok" : ""}`} href="organizer.html#modelCard" title={title}>
      <i aria-hidden="true" />{ok ? "Nugen \u00B7 API key accepted" : "Nugen \u00B7 checking"}
    </a>
  );
}

/* Social pulse.
   What travellers, residents and the news are saying about the weather: Reddit
   (r/mumbai, r/india), Mastodon hashtags and Google News, read for what they report,
   which part of a trip they touch, the reaction in them and where (engine/social.py).
   Trends build up from a rolling history; "emerging" is a kind of report running at
   twice its usual rate in the last six hours. */
const SOC_CATS = { flooding: "Flooding", transport: "Transport", alert: "Alerts", heat: "Heat", power: "Power", clear: "All clear" };
const SOC_MOODS = { frustrated: "Frustrated", worried: "Worried", relieved: "Relieved", reporting: "Just reporting" };
const SOC_FILTERS = [["all", "All"], ["traveller", "Travellers"], ["news", "News"], ["flooding", "Flooding"], ["transport", "Transport"], ["alert", "Alerts"], ["heat", "Heat"]];

function ago(h) {
  if (h == null) return "";
  return h < 1 ? `${Math.max(1, Math.round(h * 60))} min ago` : h < 48 ? `${Math.round(h)} h ago` : `${Math.round(h / 24)} d ago`;
}

function Spark({ b }) {
  const max = Math.max(1, ...b);
  return (
    <span className="soc-spark" aria-hidden="true">
      {b.map((v, i) => <i key={i} style={{ height: `${Math.max(8, (v / max) * 100)}%`, opacity: v ? 1 : 0.25 }} />)}
    </span>
  );
}

function SocialPulse() {
  const [d, setD] = useState(null);
  const [err, setErr] = useState("");
  const [filter, setFilter] = useState("all");
  const [more, setMore] = useState(false);

  useEffect(() => {
    if (STATIC_MODE) { setErr("Social signals need the live API."); return undefined; }
    const load = () => fetch(`${API}/weather/social`).then((r) => (r.ok ? r.json() : Promise.reject()))
      .then((x) => { setD(x); setErr(""); }).catch(() => setErr("Couldn't load social signals."));
    load();
    const id = setInterval(load, 120000);
    return () => clearInterval(id);
  }, []);

  const items = d ? d.items.filter((i) => filter === "all" || i.kind === filter || i.categories.includes(filter)) : [];
  const scanned = d ? Object.values(d.fetched || {}).reduce((a, b) => a + b, 0) : 0;
  const people = d ? Object.values(d.moods_48h || {}).reduce((a, b) => a + b, 0) : 0;
  const trends = d ? Object.entries(d.trends || {}).filter(([, t]) => t.buckets.some((v) => v)) : [];

  return (
    <div className="card navsec" id="social-section">
      <div className="card-head">
        <h3 className="display">Social Pulse</h3>
        <span className="meta">{d ? `Reddit · Mastodon · News · ${scanned.toLocaleString()} scanned, ${d.total} about the weather` : "Reddit · Mastodon · News"}</span>
      </div>
      <div className="soc-body">
        {err && !d ? <div className="empty">{err}</div> : !d ? <div className="empty">Reading public posts...</div> : (
          <>
            <span className="eyebrow dim">Emerging conditions &middot; last 6 h</span>
            {d.emerging.length ? d.emerging.map((e) => (
              <div className="soc-emerge" key={e.category}>
                <b>{SOC_CATS[e.category]} reports are up: {e.reports_6h} in 6 h, {e.times_usual}&times; the usual rate</b>
                {e.places.length > 0 && <span>Around {e.places.join(", ")}</span>}
                {e.example && <q>{e.example}</q>}
              </div>
            )) : <div className="soc-sub">Nothing emerging: no kind of weather report is running above its usual rate right now.</div>}

            <div className="soc-grid">
              <div>
                <span className="eyebrow dim">Trends &middot; 2 days, 6 h steps</span>
                {trends.length ? trends.map(([c, t]) => (
                  <div className="soc-trend" key={c}>
                    <span className="n">{SOC_CATS[c]}</span>
                    <Spark b={t.buckets} />
                    <span className={`dir ${t.direction}`}>{t.direction === "rising" ? "▲ rising" : t.direction === "falling" ? "▼ falling" : "steady"}</span>
                    <span className="c">{t.last_12h} in 12 h</span>
                  </div>
                )) : <div className="soc-sub">No weather reports in the last two days.</div>}
              </div>
              <div>
                <span className="eyebrow dim">Traveller reactions &middot; 48 h</span>
                {people ? (
                  <>
                    <div className="soc-mood">
                      {Object.entries(d.moods_48h).filter(([, n]) => n).map(([m, n]) => (
                        <i key={m} className={m} style={{ flex: n }} title={`${SOC_MOODS[m]}: ${n}`}>{SOC_MOODS[m]} {n}</i>
                      ))}
                    </div>
                    <div className="soc-topics">
                      {Object.entries(d.topics_48h).filter(([, n]) => n).map(([t, n]) => <span key={t}>{t} {n}</span>)}
                    </div>
                  </>
                ) : <div className="soc-sub">No weather posts from travellers in the last 48 h. {d.by_source.Reddit + d.by_source.Mastodon} older ones are in the feed.</div>}
              </div>
            </div>

            <div className="soc-filters" role="group" aria-label="Filter posts">
              {SOC_FILTERS.map(([k, t]) => <button key={k} className={filter === k ? "on" : ""} onClick={() => setFilter(k)}>{t}</button>)}
            </div>
            {items.length ? (more ? items : items.slice(0, 6)).map((i) => (
              <div className={`soc-item ${i.kind}`} key={i.id}>
                <div className="top">
                  <span className={`src ${i.source.toLowerCase()}`}>{i.source}</span>
                  <span className="ch">{i.channel}</span>
                  <span className="age">{ago(i.age_h)}</span>
                  {i.mood && i.mood !== "reporting" && <span className={`mood ${i.mood}`}>{SOC_MOODS[i.mood]}</span>}
                </div>
                <div className="t">{i.text}</div>
                <div className="tags">
                  {i.categories.map((c) => <span key={c}>{SOC_CATS[c]}</span>)}
                  {i.topics.map((t) => <span key={t} className="topic">{t}</span>)}
                  {i.places.map((p) => <span key={p.zone_id} className="place">{p.place}</span>)}
                </div>
              </div>
            )) : <div className="soc-sub">Nothing in this filter.</div>}
            {items.length > 6 && <button className="soc-more" onClick={() => setMore((m) => !m)}>{more ? "Show fewer" : `Show all ${items.length}`}</button>}
            <div className="soc-sub" style={{ marginTop: 10 }}>
              Public posts and headlines only; nothing is posted or stored beyond what the feed needs. Fresh flooding and
              transport reports near a zone feed the weather twin's flood and disruption estimates.
              {d.errors && d.errors.length ? ` Some sources didn't answer this time (${d.errors.length}); they're retried every 10 minutes.` : ""}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

/* City digital twin. The real 3D map lives in twin.html and is embedded here so
   it sits above the pressure map. The dashboard owns the clock and the selected
   zone: it tells the frame the hour and the selection, and the frame reports
   back when someone clicks a tower. Messages are only accepted from this origin
   and from this frame. */
function TwinEmbed({ hour, selected, onPick, pos }) {
  const frame = React.useRef(null);
  const ready = React.useRef(false);
  const latest = React.useRef({ hour, selected, onPick });
  latest.current = { hour, selected, onPick, pos };
  // Fixed for the life of the frame; changing the src would reload the map on every tick.
  const [src] = useState(() => `twin.html?embed=1&hour=${hour}`);

  const post = (msg) => {
    const w = frame.current && frame.current.contentWindow;
    if (w && ready.current) w.postMessage(msg, location.origin);
  };

  useEffect(() => {
    const onMsg = (e) => {
      if (e.origin !== location.origin) return;
      if (!frame.current || e.source !== frame.current.contentWindow) return;
      const m = e.data || {};
      if (m.type === "ready") {
        ready.current = true;
        post({ type: "visible", on: visible.current });
        post({ type: "hour", hour: latest.current.hour });
        post({ type: "select", id: latest.current.selected });
        const g = EPLocate.get();
        post({ type: "you", lat: g.lat, lng: g.lng, accuracy: g.accuracy, heading: g.heading, speed: g.speed });
      } else if (m.type === "select" && m.id) {
        latest.current.onPick(m.id);
      }
    };
    window.addEventListener("message", onMsg);
    return () => window.removeEventListener("message", onMsg);
  }, []);

  // Tell the frame when it is out of view, so it stops animating what nobody can see.
  const visible = React.useRef(true);
  useEffect(() => {
    if (!frame.current || !("IntersectionObserver" in window)) return;
    const io = new IntersectionObserver(([e]) => {
      visible.current = e.isIntersecting;
      post({ type: "visible", on: e.isIntersecting });
    });
    io.observe(frame.current);
    return () => io.disconnect();
  }, []);

  useEffect(() => { post({ type: "hour", hour }); }, [hour]);
  useEffect(() => { post({ type: "select", id: selected }); }, [selected]);
  // Stream the position straight from the locator: the page's own `pos` only changes every
  // ~30 m, too coarse for a map that follows you as you walk.
  useEffect(() => EPLocate.onChange((g) => post({ type: "you", lat: g.lat, lng: g.lng, accuracy: g.accuracy,
    heading: g.heading, speed: g.speed })), []);

  return (
    <div className="card navsec" id="twin-section">
      <div className="card-head">
        <h3 className="display">City Digital Twin</h3>
        <a className="meta" href={`twin.html?hour=${hour}`} target="_blank" rel="noopener"
           style={{ textDecoration: "none" }}>Open full view &#8599;</a>
      </div>
      <iframe ref={frame} className="twin-frame" src={src} title="City digital twin: 3D map of zone pressure"
              loading="eager" />
    </div>
  );
}

/* Live KPI strip. Numbers glide to each new reading instead of jumping, and
   every figure says how far it moved since the previous tick, so a change is
   noticed as it happens rather than found by comparing screenshots. */
function useTween(target, ms = 700) {
  const [val, setVal] = useState(target);
  const cur = React.useRef(target);

  useEffect(() => {
    if (typeof target !== "number" || !isFinite(target) || typeof cur.current !== "number") {
      cur.current = target; setVal(target); return undefined;
    }
    const from = cur.current, t0 = performance.now();
    let raf;
    const tick = (now) => {
      const t = Math.min(1, (now - t0) / ms);
      const v = from + (target - from) * (1 - Math.pow(1 - t, 3));
      cur.current = v; setVal(v);
      if (t < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [target, ms]);

  return val;
}

// `badWhenUp`: whether a rise is bad news (occupancy, alerts) or good (beds free).
function Kpi({ label, value, prev, decimals = 0, suffix, unit, cls, badWhenUp, note }) {
  const shown = useTween(typeof value === "number" ? value : null);
  const numeric = typeof value === "number";
  const d = numeric && typeof prev === "number" ? value - prev : null;
  const flat = d == null || Math.abs(d) < Math.pow(10, -decimals) / 2;

  let delta = "\u00A0", dcls = "";
  if (!flat) {
    delta = `${d > 0 ? "\u25B2" : "\u25BC"} ${Math.abs(d).toLocaleString(undefined, { maximumFractionDigits: decimals, minimumFractionDigits: decimals })}${unit ? " " + unit : ""}`;
    dcls = (d > 0) === !!badWhenUp ? "bad" : "good";
  } else if (d != null) delta = "\u2014 steady";

  return (
    <div className="kpi">
      <div className={`num v ${cls || ""}`}>
        {numeric ? (typeof shown === "number" ? shown : value).toLocaleString(undefined, { maximumFractionDigits: decimals, minimumFractionDigits: decimals }) : value}
        {suffix}
      </div>
      <div className="k">{label}</div>
      <div className={`delta ${dcls}`} title={note || ""}>
        {note ? (flat ? note : `${note} \u00B7 ${delta}`) : delta}
      </div>
    </div>
  );
}

// Gate KPIs cover every gate with crowd flow right now (queueing to get in, or
// pushing to get out), across all venues. Looking only at events that are
// "running" would miss the busiest moment, the exit surge just after one ends.
function venueKpis(venues) {
  const active = [], outOfService = new Map();
  (venues || []).forEach((v) => {
    const gs = v.gates || [];
    const flowing = gs.filter((g) => g.phase && g.phase !== "idle");
    if (!flowing.length) return;
    flowing.forEach((g) => active.push({ ...g, venue: v.venue_name }));
    // A gate an organiser has taken out of service is not flowing, but during a
    // surge it is exactly the one that matters, so it counts against "open".
    gs.filter((g) => g.status && g.status !== "open").forEach((g) => outOfService.set(g.gate_id, g));
  });
  if (!active.length) return { idle: true };
  const busiest = active.slice().sort((a, b) => gatePct(b) - gatePct(a))[0];
  const venueNames = [...new Set(active.map((g) => g.venue))];
  const oos = outOfService.size;
  const where = venueNames.length === 1 ? venueNames[0] : `${venueNames.length} venues`;
  return {
    idle: false, busiest,
    open: active.filter((g) => g.live_status !== "closed").length, total: active.length + oos,
    where: oos ? `${oos} out of service` : where,
  };
}

function Kpis({ summary, prev, venues, hour }) {
  // Remember the previous hour's gate reading, so the change indicator compares
  // like with like (the `venues` prop only ever holds the current hour).
  const memo = React.useRef({ hour: null, now: null, before: null });
  const vk = venueKpis(venues);
  if (memo.current.hour !== hour) {
    memo.current = { hour, now: vk, before: memo.current.now };
  } else {
    memo.current.now = vk;
  }
  const pv = memo.current.before;
  const WARN_PCT = 75;

  return (
    <div className="kpis" aria-live="off">
      <Kpi label="Citywide occupancy" value={summary.citywide_occupancy_pct} prev={prev && prev.citywide_occupancy_pct}
           decimals={1} suffix="%" unit="pts" cls={summary.citywide_occupancy_pct >= WARN_PCT ? "warn" : "good"} badWhenUp />
      <Kpi label="Zones at capacity" value={summary.zones_saturated} prev={prev && prev.zones_saturated}
           suffix={<small>/{summary.zones_total}</small>} cls={summary.zones_saturated ? "accent" : "good"} badWhenUp />
      <Kpi label="Critical alerts" value={summary.alerts_critical} prev={prev && prev.alerts_critical}
           cls={summary.alerts_critical ? "accent" : "good"} badWhenUp />
      {vk.idle ? (
        <Kpi label="Busiest gate load" value={"\u2014"} note="No crowd at the gates" />
      ) : (
        <Kpi label="Busiest gate load" value={Math.round(gatePct(vk.busiest))} prev={pv && !pv.idle ? Math.round(gatePct(pv.busiest)) : undefined}
             suffix="%" cls={gatePct(vk.busiest) >= GATE_CLOSE ? "accent" : gatePct(vk.busiest) >= GATE_WARN ? "warn" : "good"} badWhenUp note={vk.busiest.name} />
      )}
      {vk.idle ? (
        <Kpi label="Gates open" value={"\u2014"} note="Venues idle" />
      ) : (
        <Kpi label="Gates open" value={vk.open} prev={pv && !pv.idle ? pv.open : undefined}
             suffix={<small>/{vk.total}</small>} cls={vk.open === vk.total ? "good" : "warn"} note={vk.where} />
      )}
    </div>
  );
}

function SkeletonWall() {
  return (
    <div>
      <div className="kpis">
        {[0, 1, 2, 3, 4, 5].map((i) => (

            <div className="sk" style={{ height: 40, width: 120 }} />
            <div className="sk" style={{ height: 12, width: 90, marginTop: 10 }} />

        ))}

}

function App() {
  const attendeeRef = React.useRef(null);
  const topRef = React.useRef(null);

  // The visitor's position, asked for as soon as the page opens and followed as they move.
  const [pos, setPos] = useState(null);
  useEffect(() => {
    EPLocate.mountBanner();
    EPPresence.init();
    let last = null;
    const off = EPLocate.onChange((g) => {
      if (g.lat == null) { last = null; setPos(null); return; }
      // Ignore GPS jitter: only re-rank once they have really moved (about 30 m).
      if (last && EPLocate.distanceKm(last.lat, last.lng, g.lat, g.lng) < 0.03) return;
      last = { lat: g.lat, lng: g.lng };
      setPos({ lat: g.lat, lng: g.lng, accuracy: g.accuracy });
    });
    EPLocate.autoStart();
    return off;
  }, []);

  const [navOn, setNavOn] = useState("twin");
  const clickedAt = React.useRef(0);
  const goTo = (where) => {
    const el = document.getElementById(`${where}-section`);
    if (!el) return;
    clickedAt.current = Date.now();          // the scroll passes other sections; don't flicker through them
    setNavOn(where);
    scrollToSection(el);
  };

  // Keep the header's highlight on the section you're reading: the last one whose
  // top has passed just under the sticky header. At the very bottom of the page the
  // last section wins even if it is too short to reach that line.
  useEffect(() => {
    const onScroll = () => {
      if (Date.now() - clickedAt.current < 900) return;
      const bar = document.querySelector(".topbar");
      const line = (bar && getComputedStyle(bar).position === "sticky" ? bar.offsetHeight : 0) + 80;
      let on = NAV_SECTIONS[0].id;
      NAV_SECTIONS.forEach((n) => {
        const el = document.getElementById(`${n.id}-section`);
        if (el && el.getBoundingClientRect().top <= line) on = n.id;
      });
      if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) on = NAV_SECTIONS[NAV_SECTIONS.length - 1].id;
      setNavOn(on);
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  const [hour, setHour] = useState(DEMO_START_HOUR);
  const [playing, setPlaying] = useState(true);

  const [zones, setZones] = useState([]);
  const [forecasts, setForecasts] = useState([]);
  const [alerts, setAlerts] = useState([]);
  const [summary, setSummary] = useState(null);
  const [prevSummary, setPrevSummary] = useState(null);
  const summaryRef = React.useRef(null);
  const [transport, setTransport] = useState([]);
  const [hotels, setHotels] = useState([]);
  const [events, setEvents] = useState(null);
  const [venues, setVenues] = useState([]);
  const [reroutes, setReroutes] = useState({});
  const [precomputed, setPrecomputed] = useState(null);
  const [sims, setSims] = useState(null);
  const [bench, setBench] = useState(null);

  const [selected, setSelected] = useState(null);
  const [recs, setRecs] = useState(null);
  const [log, setLog] = useState([]);
  const [freshIds, setFreshIds] = useState(() => new Set());
  const [err, setErr] = useState(null);

  const seenIds = React.useRef(new Set());
  const firstLoad = React.useRef(true);
  const manualPick = React.useRef(false);

  const pick = (id) => { manualPick.current = true; setSelected(id); };

  const load = useCallback(async (h) => {
    try {
      let z, f, a, s, t, ht, ev, vn;

      if (STATIC_MODE) {
        // Everything for this hour arrives in one file, including the ranking
        // for every zone and the simulator's results across the slider range.
        const bundle = await fetch(`data/hour-${h}.json`).then((r) => r.json());
        ({ zones: z, forecast: f, alerts: a, summary: s,
           transport: t, hotels: ht, events: ev } = bundle);
        setVenues(bundle.venues || []);
        setReroutes(bundle.reroutes || {});
        setPrecomputed({
          recs: bundle.recommendations,
          density: bundle.density || {},
          exitRedirect: bundle.exit_redirect || {},
          reverseUber: bundle.reverse_uber || {},
          incentives: bundle.incentives || [],
        });
      } else {
        [z, f, a, s, t, ht, ev, vn] = await Promise.all([
          fetch(`${API}/zones?hour=${h}`).then((r) => r.json()),
          fetch(`${API}/forecast?hour=${h}`).then((r) => r.json()),
          fetch(`${API}/alerts?hour=${h}`).then((r) => r.json()),
          fetch(`${API}/summary?hour=${h}`).then((r) => r.json()),
          fetch(`${API}/transport?hour=${h}`).then((r) => r.json()),
          fetch(`${API}/hotels?hour=${h}`).then((r) => r.json()),
          fetch(`${API}/events?hour=${h}`).then((r) => r.json()),
          fetch(`${API}/venues?hour=${h}`).then((r) => r.json()),
        ]);
        setVenues(vn || []);
        // Live mode has no precomputed reroutes; the panel fetches per link.
        setReroutes({});
      }

      const keyOf = (x) => `${x.zone_id}|${x.metric}|${x.severity}`;
      const arrived = a.filter((x) => !seenIds.current.has(keyOf(x))).map(keyOf);
      a.forEach((x) => seenIds.current.add(keyOf(x)));

      if (arrived.length && !firstLoad.current) {
        setFreshIds(new Set(arrived));
        setTimeout(() => setFreshIds(new Set()), 2200);

        arrived.slice(0, 2).forEach((key) => {
          const hit = a.find((x) => keyOf(x) === key);
          if (!hit) return;
          setLog((l) => [{
            kind: "alert",
            title: hit.severity === "critical" ? "Critical threshold crossed" : "Pressure rising",
            body: hit.message,
            metric: `${hit.current_pct.toFixed(0)}% capacity`,
            hour: h,
          }, ...l].slice(0, 8));
        });
      }
      firstLoad.current = false;

      setZones(z); setForecasts(f); setAlerts(a);
      setPrevSummary(summaryRef.current); summaryRef.current = s; setSummary(s);
      setTransport(t); setHotels(ht); setEvents(ev);
      setErr(null);
    } catch (e) {
      setErr(e.message || "Cannot reach the API");
    }
  }, []);

  useEffect(() => { load(hour); }, [hour, load]);

  // Follow the active intake point. While the venue has room it is the focus;
  // once full it can take nobody, so the hub steps outward to the nearest zone
  // that can, and destinations re-rank from there.
  useEffect(() => {
    if (manualPick.current || !zones.length) return;
    const isFull = (z) => Math.round(z.occupancy_pct) >= 100;
    const byPressure = [...zones].sort((a, b) => b.occupancy_pct - a.occupancy_pct);
    const hottest = byPressure[0];

    let hub = hottest;
    if (hottest && isFull(hottest)) {
      const open = zones.filter((z) => !isFull(z))
        .sort((a, b) => a.distance_to_venue_km - b.distance_to_venue_km);
      hub = open[0] || hottest;
    }
    if (hub && hub.id !== selected) setSelected(hub.id);
  }, [zones, selected]);

  useEffect(() => {
    if (!playing) return;
    const id = setInterval(() => {
      setHour((h) => (h >= LAST_HOUR ? (setPlaying(false), h) : h + 1));
    }, TICK_MS);
    return () => clearInterval(id);
  }, [playing]);

  // Simulations are the bulk of the data but only one zone's are ever shown,
  // so they live in their own file and load when a zone is selected.
  useEffect(() => {
    if (!STATIC_MODE || !selected) { setSims(null); return; }
    let cancelled = false;
    fetch(`data/sim-${hour}-${selected}.json`)
      .then((r) => (r.ok ? r.json() : null))
      .then((d) => { if (!cancelled) setSims(d); })
      .catch(() => { if (!cancelled) setSims(null); });
    return () => { cancelled = true; };
  }, [selected, hour]);

  useEffect(() => {
    if (!selected) { setRecs(null); return; }

    if (STATIC_MODE) {
      setRecs(precomputed?.recs?.[selected] || null);
      return;
    }
    fetch(`${API}/recommendations/${selected}?hour=${hour}`)
      .then((r) => r.json()).then(setRecs).catch(() => setRecs(null));
  }, [selected, hour, precomputed]);

  useEffect(() => {
    const url = STATIC_MODE ? "data/meta.json" : `${API}/ml/benchmark`;
    fetch(url)
      .then((r) => (r.ok ? r.json() : null))
      .then((d) => setBench(STATIC_MODE ? (d ? d.benchmark : null) : d))
      .catch(() => setBench(null));
  }, []);

  if (err) {
    return (
      <div className="status">
        <strong>The API isn't responding.</strong><br /><br />
        Start it from the backend folder:<br /><br />
        <code>py generate_city.py</code><br />
        <code>py -m uvicorn api:app --reload</code><br /><br />
        Then reload this page.
      </div>
    );
  }

  const hubZone = zones.find((z) => z.id === selected);
  const hubName = hubZone ? hubZone.name : selected;

  return (
    <div>
      <div className="topbar">
      <header className="mast">
        <div className="brand">
          <img className="mark" src="logo.svg" alt="" />
          <div>
            <div className="name">EVENTPULSE</div>
            <div className="sub">Orchestration Engine</div>
          </div>
        </div>

        <nav aria-label="Dashboard sections">
          <button onClick={() => { window.location.href = "home.html"; }}>Home</button>
          {NAV_SECTIONS.map((n) => (
            <button key={n.id} className={navOn === n.id ? "on" : ""} aria-current={navOn === n.id ? "true" : undefined}
                    onClick={() => goTo(n.id)}>{n.label}</button>
          ))}
        </nav>

        <div className="right">
          <NugenBadge />
          <div className="clock">
            <div className="lab">Event hour</div>
            <div className="scrub">
              <button className="play" onClick={() => setPlaying((p) => !p)}
                      aria-label={playing ? "Pause the clock" : "Run the clock"}>
                {playing ? "II" : "\u25B6"}
              </button>
              <input type="range" min="24" max={LAST_HOUR} value={hour}
                     onChange={(e) => { setPlaying(false); setHour(Number(e.target.value)); }}
                     aria-label="Event hour" />
              <span className="hour">{dayLabel(hour)}</span>
            </div>
            <div className={`beat${playing ? " pulsing" : ""}`}>
              <i aria-hidden="true" />{playing ? "Live" : "Paused"}
            </div>
          </div>
        </div>
      </header>
      {summary && <Kpis summary={summary} prev={prevSummary} venues={venues} hour={hour} />}
      </div>

      {!summary ? <SkeletonWall /> : (
        <>
          <div className="body" ref={topRef}>
              <main className="stage">
                <TwinEmbed hour={hour} selected={selected} onPick={pick} pos={pos} />
                <WeatherTwin hour={hour} />
                <SocialPulse />

                <div className="card navsec" id="pressure-section">
                  <div className="card-head">
                    <h3 className="display">Pressure Map</h3>
                    <span className="meta">
                      {summary.zones_saturated > 0
                        ? `${summary.zones_saturated} of ${summary.zones_total} at capacity`
                        : "All zones holding"}
                    </span>
                  </div>
                  <PressureMap zones={zones} forecasts={forecasts} transport={transport}
                               selected={selected} onSelect={pick} recs={recs} />
                </div>

                <VenueFloor venues={venues} hour={hour} precomputed={precomputed} />

                <div className="duo" style={{ marginBottom: 22 }}>
                  <AbsorptionGrid zones={zones} forecasts={forecasts}
                                  selected={selected} onSelect={pick} />
                  <div className="card">
                    <div className="card-head">
                      <span className="eyebrow">What-if engine</span>
                    </div>
                    <div style={{ padding: "4px 18px 18px" }}>
                      {selected
                        ? <Simulator zoneId={selected} zoneName={hubName} hour={hour}
                                   sims={sims} />
                        : <div className="empty">Select a zone to model a redirect.</div>}
                    </div>
                  </div>
                </div>

                <Recommendations data={recs} wide />

              <aside className="rail">
                <div className="sect">
                  <span className="eyebrow">Predictive alerts</span>
                  <h3 className="display" style={{ marginTop: 7 }}>Alerts</h3>
                  <div className="lead">Most urgent first</div>

                  {alerts.length === 0 && (

                    <div key={a.id}

                </div>

                <ActivityLog entries={log} />
                <IncentivesPanel hour={hour} staticData={precomputed?.incentives} />
                <NextUp data={events} />
                <TransportLoad links={transport} zones={zones} reroutes={reroutes} />
                <Scorecard data={bench} />
              </aside>
          </div>

          <section className="stage stays-section navsec" id="stays-section" ref={attendeeRef}
                   style={{ borderTop: "1px solid var(--line)" }}>
            <Stays hotels={hotels} pos={pos} venues={venues} />
          </section>
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
