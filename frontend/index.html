<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EventPulse: Orchestration Engine</title>
<link rel="icon" type="image/svg+xml" href="logo.svg" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg:        #0A0A0A;
    --panel:     #101010;
    --panel-hi:  #171717;
    --line:      #242424;
    --ink:       #F2F2F2;
    --ink-dim:   #8C8C8C;
    --ink-faint: #5A5A5A;

    /* Signal palette. Orange is the house accent and doubles as the
       at-capacity state, so the most urgent thing on screen is also the most
       brand-coloured. */
    --accent:    #FF3B1F;
    --good:      #00C46A;
    --warn:      #E8A33D;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Barlow", system-ui, sans-serif;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- shared type ---------- */
  .eyebrow {
    font-family: "Barlow Condensed", sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .eyebrow.dim { color: var(--ink-faint); }

  h2.display, h3.display {
    font-family: "Archivo", sans-serif;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0;
  }

  h2.display { font-size: 26px; }
  h3.display { font-size: 19px; }

  .num {
    font-family: "Archivo", sans-serif;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  /* ---------- masthead ---------- */
  .mast {
    display: flex;
    align-items: center;
    gap: 26px;
    padding: 14px 26px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }

  .brand { display: flex; align-items: center; gap: 11px; }

  .mark { width: 40px; height: 40px; display: block; filter: drop-shadow(0 4px 14px rgba(255,59,31,.35)); }

  .brand .name {
    font-family: "Archivo", sans-serif;
    font-weight: 900;
    font-size: 17px;
    letter-spacing: .04em;
    line-height: 1;
  }

  .brand .sub {
    font-family: "Barlow Condensed", sans-serif;
    font-size: 11px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-top: 3px;
  }

  nav { display: flex; gap: 2px; margin-left: 14px; flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }

  nav button {
    background: none;
    border: none;
    color: var(--ink-faint);
    font-family: "Barlow Condensed", sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    padding: 8px 11px;
    cursor: pointer;
    white-space: nowrap;
    flex: none;
  }

  nav button.on { color: var(--ink); border-bottom: 2px solid var(--accent); }
  nav button:focus-visible { outline: 2px solid var(--ink-dim); outline-offset: -2px; }

  .mast .right { margin-left: auto; display: flex; align-items: center; gap: 22px; }

  .clock { text-align: right; }

  .clock .lab {
    font-family: "Barlow Condensed", sans-serif;
    font-size: 11px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .scrub { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
  .scrub input { width: 150px; accent-color: var(--accent); }
  .scrub .hour { font-family: "Archivo", sans-serif; font-variant-numeric: tabular-nums;
                 font-weight: 700; font-size: 17px; min-width: 92px; text-align: right; }

  .play {
    background: var(--panel-hi);
    border: 1px solid var(--line);
    color: var(--ink);
    width: 26px; height: 26px;
    padding: 0; cursor: pointer;
    font-size: 10px; line-height: 1;
    display: grid; place-items: center;
  }

  .play:focus-visible { outline: 2px solid var(--ink-dim); outline-offset: 1px; }

  .beat {
    display: flex; align-items: center; gap: 7px;
    font-family: "Barlow Condensed", sans-serif;
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-faint);
    margin-top: 5px; justify-content: flex-end;
  }

  .beat i { width: 6px; height: 6px; background: var(--ink-faint); display: inline-block; }
  .beat.pulsing i { background: var(--accent); animation: beat 2s steps(1) infinite; }
  @keyframes beat { 0%,60% { opacity: 1; } 61%,100% { opacity: .25; } }

  /* ---------- KPI strip ---------- */
  .kpis {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }

  .kpi { padding: 20px 26px; border-right: 1px solid var(--line); }
  .kpi:last-child { border-right: none; }

  .kpi .v { font-size: 40px; line-height: 1; }
  .kpi .v.accent { color: var(--accent); }
  .kpi .v.good   { color: var(--good); }
  .kpi .v.warn   { color: var(--warn); }
  .kpi .v small  { font-size: 20px; color: var(--ink-faint); font-weight: 700; }

  /* Masthead and KPIs travel together, so the live numbers stay in view while
     you work down the page. Only where there is room for it. */
  .topbar { background: var(--bg); }
  @media (min-width: 901px) {
    .topbar { position: sticky; top: 0; z-index: 40; box-shadow: 0 8px 22px rgba(0,0,0,.45); }
    .topbar .mast { padding: 8px 26px; }
    .topbar .kpi { padding: 8px 18px 7px; }
    .topbar .kpi .v { font-size: 26px; }
    .topbar .kpi .v small { font-size: 14px; }
    .topbar .kpi .k { margin-top: 4px; font-size: 10.5px; }
    .topbar .kpi .delta { margin-top: 2px; font-size: 12px; min-height: 14px; }
  }
  .kpi .delta { font-family: "Barlow Condensed", sans-serif; font-size: 12.5px; letter-spacing: .06em;
                margin-top: 4px; color: var(--ink-faint); min-height: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi .delta.good { color: var(--good); }
  .kpi .delta.bad  { color: var(--accent); }
  .kpi .k {
    font-family: "Barlow Condensed", sans-serif;
    font-size: 11.5px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-top: 8px;
  }

  /* ---------- layout ---------- */
  .body { display: grid; grid-template-columns: 1fr 380px; }

  @media (max-width: 1080px) {
    .body { grid-template-columns: 1fr; }
    .rail { border-left: none; border-top: 1px solid var(--line); }
    .duo { grid-template-columns: 1fr !important; }
  }

  .stage {
    padding: 24px 26px 48px;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  /* The rail grows with the alert count, so the columns cannot be matched by a
     fixed height. The last card takes the slack instead, which keeps the two
     columns ending together without leaving bare background beneath it. */
  .stage > .card:last-child { flex: 1; }

  .rail {
    border-left: 1px solid var(--line);
    background: var(--panel);
    padding: 24px 22px 48px;
    min-width: 0;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .card-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 14px; padding: 15px 18px 0;
  }

  .card-head .meta {
    font-family: "Barlow Condensed", sans-serif;
    font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-faint);
  }

  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .duo .card { margin-bottom: 0; }

  /* ---------- zone absorption grid ---------- */
  .grid-tiles {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    padding: 16px 18px 8px;
  }

  .tile {
    background: var(--panel-hi);
    border: 1px solid transparent;
    padding: 13px 12px 11px;
    cursor: pointer;
    text-align: left;
  }

  .tile:focus-visible { outline: 2px solid var(--ink-dim); outline-offset: -2px; }
  .tile.sel { border-color: var(--ink); }

  /* Tiles carry the same risk band as the map and the chart, so one zone reads
     the same wherever it appears. The whole tile shifts, not just the reading,
     so a filling zone is visible when scanning the grid rather than only when
     reading it. */
  /* Every band fills its tile, so the grid reads as three solid states at a
     glance: green has room, amber is filling, orange is full. */
  .tile.band-ok { background: var(--good); }
  .tile.band-ok .id,
  .tile.band-ok .pct,
  .tile.band-ok .delta { color: #0A0A0A; }
  .tile.band-ok .zname { color: rgba(10,10,10,.7); }

  .tile.band-warn { background: var(--warn); }
  .tile.band-warn .id,
  .tile.band-warn .pct,
  .tile.band-warn .delta { color: #0A0A0A; }
  .tile.band-warn .zname { color: rgba(10,10,10,.7); }

  /* Emptiest zone. Now that all calm tiles are green, the highlight has to be
     something other than colour, so it takes an outline and a marker. */
  .tile.best { background: var(--good); box-shadow: inset 0 0 0 2px #0A0A0A; }
  .tile.best .id, .tile.best .pct, .tile.best .delta { color: #0A0A0A; }
  /* No label: the tile is too narrow to take one without wrapping, and the
     inset border already sets it apart from the other green tiles. The title
     attribute carries the bed count for anyone who hovers. */
  .tile.hot { background: var(--accent); }
  .tile.hot .id, .tile.hot .pct, .tile.hot .delta { color: #0A0A0A; }

  .tile .id {
    font-family: "Archivo", sans-serif;
    font-weight: 800; font-size: 13px; letter-spacing: .06em;
    color: var(--ink-dim);
  }

  .tile .pct {
    font-family: "Archivo", sans-serif;
    font-variant-numeric: tabular-nums;
    font-weight: 700; font-size: 13px; float: right;
    color: var(--ink);
  }

  .tile .delta {
    font-family: "Barlow Condensed", sans-serif;
    font-variant-numeric: tabular-nums;
    font-size: 12px; color: var(--ink-faint);
    margin-top: 7px; clear: both;
  }

  .tile .zname {
    font-size: 11px; color: var(--ink-faint);
    margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .tile.best .zname, .tile.hot .zname { color: rgba(10,10,10,.7); }

  .propagation { padding: 6px 18px 16px; }
  .propagation p { font-size: 13px; color: var(--ink-dim); margin: 6px 0 0; line-height: 1.45; }

  .nugen-badge { display: inline-flex; align-items: center; gap: 7px; font-family: "Barlow Condensed", sans-serif; font-size: 12px;
    font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); text-decoration: none;
    border: 1px solid var(--line); padding: 5px 10px; white-space: nowrap; }
  .nugen-badge i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint); }
  .nugen-badge.ok { color: #c9b3ff; border-color: #4b3a78; } .nugen-badge.ok i { background: #9b6bff; box-shadow: 0 0 0 3px rgba(155,107,255,.22); }
  .nugen-badge:hover { border-color: var(--ink-faint); }
  @media (max-width: 1180px) { .nugen-badge { display: none; } }
  /* ---------- weather twin ---------- */
  .wx-body { padding: 10px 18px 18px; }
  .wx-top { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 760px) { .wx-top { grid-template-columns: 1fr; } }
  .wx-now { background: var(--panel-hi); padding: 12px 14px; }
  .wx-t { margin-top: 6px; font-size: 15px; } .wx-t b { font-family: "Archivo", sans-serif; font-size: 30px; font-weight: 800; margin-right: 6px; }
  .wx-sub { color: var(--ink-dim); font-size: 13px; line-height: 1.45; margin-top: 4px; }
  .wx-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .wx-chips span { font-size: 12px; font-weight: 600; padding: 3px 9px; background: #222; color: var(--ink-faint); }
  .wx-chips span.on { background: rgba(77,163,255,.16); color: #8fc4ff; }
  .wx-latest { display: block; margin-top: 8px; color: var(--ink-dim); font-size: 12.5px; line-height: 1.4; text-decoration: none; }

  .wx-fx { margin-top: 6px; }
  .wx-ord { font-family: "Barlow Condensed", sans-serif; font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); margin: 10px 0 4px; }
  .wx-e { padding: 7px 10px; margin: 4px 0; background: var(--panel-hi); border-left: 3px solid; font-size: 13.5px; line-height: 1.4; }
  .wx-e.o1 { border-left-color: #4DA3FF; } .wx-e.o2 { border-left-color: var(--warn); } .wx-e.o3 { border-left-color: var(--accent); }
  .wx-e.sum { background: none; color: var(--ink-faint); border-left-color: transparent; }
  .wx-quick { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .wx-quick button { background: var(--panel-hi); color: var(--ink); border: 1px solid var(--line); padding: 8px 14px; font: 600 13px "Archivo", sans-serif; cursor: pointer; }
  .wx-quick button.on { border-color: #4DA3FF; color: #8fc4ff; }
  .wx-quick button:disabled { opacity: .6; cursor: wait; }
  .wx-sim { margin-top: 12px; }
  .wx-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 8px; }
  @media (max-width: 900px) { .wx-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .wx-kpis div { background: var(--panel-hi); padding: 10px 12px; }
  .wx-kpis small { display: block; color: var(--ink-faint); font-size: 11.5px; }
  .wx-kpis b { display: block; font-family: "Archivo", sans-serif; font-size: 22px; font-weight: 800; margin: 2px 0; }
  .wx-range { color: var(--ink-faint); font-size: 11.5px; }
  .plan-box { margin-top: 14px; border: 1px solid #2c4f78; background: rgba(77,163,255,.05); padding: 12px 14px; }
  .plan-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .plan-src { font-size: 11.5px; font-weight: 700; padding: 3px 8px; background: #222; color: var(--ink-dim); }
  .plan-src.nugen { background: rgba(155,107,255,.18); color: #c9b3ff; }
  .plan-box ol { margin: 8px 0 0; padding-left: 20px; font-size: 13.5px; line-height: 1.5; }
  .plan-box li { margin: 4px 0; }
  .plan-msg { margin-top: 8px; color: var(--ink-dim); font-size: 13px; font-style: italic; }
  /* ---------- social pulse ---------- */
  .soc-body { padding: 10px 18px 18px; }
  .soc-sub { color: var(--ink-dim); font-size: 13px; line-height: 1.45; margin-top: 6px; }
  .soc-emerge { margin: 8px 0; padding: 10px 12px; border-left: 3px solid var(--accent); background: rgba(255,59,31,.07); display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; }
  .soc-emerge span { color: var(--ink-dim); } .soc-emerge q { color: var(--ink-dim); font-style: italic; }
  .soc-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin: 16px 0 14px; }
  @media (max-width: 760px) { .soc-grid { grid-template-columns: 1fr; } }
  .soc-trend { display: grid; grid-template-columns: 84px 90px 80px 1fr; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; }
  .soc-trend .dir { font-size: 12px; color: var(--ink-faint); } .soc-trend .dir.rising { color: var(--accent); } .soc-trend .dir.falling { color: var(--good); }
  .soc-trend .c { color: var(--ink-faint); font-size: 12px; }
  .soc-spark { display: flex; align-items: flex-end; gap: 2px; height: 20px; }
  .soc-spark i { flex: 1; background: #4DA3FF; min-height: 2px; }
  .soc-mood { display: flex; height: 26px; margin-top: 8px; font-size: 11.5px; font-weight: 700; overflow: hidden; }
  .soc-mood i { font-style: normal; display: flex; align-items: center; padding: 0 8px; white-space: nowrap; overflow: hidden; color: #0A0A0A; }
  .soc-mood i.frustrated { background: #FF7A5C; } .soc-mood i.worried { background: var(--warn); } .soc-mood i.relieved { background: var(--good); } .soc-mood i.reporting { background: #5a5a5a; color: #eee; }
  .soc-topics { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .soc-topics span { font-size: 12px; padding: 2px 8px; background: #222; color: var(--ink-dim); }
  .soc-filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 8px; }
  .soc-filters button { background: var(--panel-hi); border: 1px solid var(--line); color: var(--ink-dim); padding: 5px 11px; font: 600 12.5px "Archivo", sans-serif; cursor: pointer; }
  .soc-filters button.on { color: var(--ink); border-color: #4DA3FF; }
  .soc-item { display: block; padding: 10px 12px; margin: 6px 0; background: var(--panel-hi); border-left: 3px solid #3a3a3a; text-decoration: none; color: var(--ink); }
  .soc-item.traveller { border-left-color: #9b6bff; }
  .soc-item .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 11.5px; color: var(--ink-faint); }
  .soc-item .src { font-weight: 700; padding: 1px 6px; background: #2a2a2a; color: var(--ink); }
  .soc-item .src.reddit { background: #ff4500; color: #fff; } .soc-item .src.mastodon { background: #6364ff; color: #fff; }
  .soc-item .mood { font-weight: 700; } .soc-item .mood.frustrated { color: #FF7A5C; } .soc-item .mood.worried { color: var(--warn); } .soc-item .mood.relieved { color: var(--good); }
  .soc-item .t { font-size: 13.5px; line-height: 1.45; margin-top: 5px; }
  .soc-item .tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
  .soc-item .tags span { font-size: 11px; padding: 1px 6px; background: rgba(77,163,255,.14); color: #8fc4ff; }
  .soc-item .tags span.topic { background: #262626; color: var(--ink-dim); } .soc-item .tags span.place { background: rgba(155,107,255,.16); color: #c9b3ff; }
  .soc-more { margin-top: 6px; background: none; border: 1px solid var(--line); color: var(--ink); padding: 7px 14px; font: 600 12.5px "Archivo", sans-serif; cursor: pointer; }
  /* ---------- exits ---------- */
  .exit-opt { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 12px;
    background: var(--panel-2, rgba(255,255,255,0.03)); border: 1px solid transparent; }
  .exit-opt.best { border-color: var(--good); background: rgba(0,196,106,.07); }
  .exit-name { font-weight: 600; font-size: 13.5px; } .exit-why { color: var(--ink-dim); font-size: 13px; margin-top: 2px; }
  .exit-status { font-size: 12px; font-weight: 700; }
  /* ---------- gates ---------- */
  .gate-list { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .gate-row { padding: 8px 10px; background: var(--panel-2, rgba(255,255,255,0.03)); }
  .gate-top { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .gate-top b { flex: 1; font-weight: 600; }
  .gate-pct { font-family: "Archivo", sans-serif; font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }
  .gate-badge { padding: 3px 9px; font-size: 11.5px; font-weight: 700; color: #fff; }
  .gate-bar { position: relative; height: 6px; background: #1d1d1d; margin: 7px 0 5px; }
  .gate-bar i { position: absolute; left: 0; top: 0; bottom: 0; transition: width .6s ease, background .6s ease; }
  .gate-bar em { position: absolute; top: -2px; bottom: -2px; width: 1px; background: rgba(255,255,255,.35); }
  .gate-redirect { margin-top: 5px; font-size: 12.5px; padding: 4px 8px; }
  .gate-redirect.out { color: #ffb4a6; background: rgba(255,59,31,.1); border-left: 2px solid var(--accent); }
  .gate-redirect.in { color: #9fe0bf; background: rgba(0,196,106,.08); border-left: 2px solid var(--good); }
  .gate-held { margin-top: 8px; padding: 8px 10px; font-size: 13px; color: #ffb4a6; background: rgba(255,59,31,.1); border-left: 3px solid var(--accent); }
  .fd-redir { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
  .fd-redir path { stroke-dasharray: 5 4; animation: fdflow .9s linear infinite; opacity: .9; }
  .fd-redir-lbl { position: absolute; transform: translate(-50%, -50%); z-index: 5; pointer-events: none; white-space: nowrap;
    background: rgba(40,8,4,.92); border: 1px solid #FF3B1F; color: #ffd2c9; font: 700 11px "Archivo", sans-serif; padding: 2px 7px; }
  .fd-gpct { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); font: 800 10.5px "Archivo", sans-serif;
    background: rgba(10,10,10,.85); padding: 0 4px; white-space: nowrap; }
  .fd-keys i.redir-key { background: repeating-linear-gradient(90deg, #FF3B1F 0 4px, transparent 4px 7px); width: 16px; height: 3px; vertical-align: 2px; }
  /* ---------- floor density ---------- */
  .fd { margin-top: 18px; }
  .fd-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .fd-sum { font-size: 13px; color: var(--ink-dim); }
  .fd-sum b { color: var(--ink); font-family: "Archivo", sans-serif; font-size: 16px; }

const LOCAL = location.hostname === "127.0.0.1" || location.hostname === "localhost"

const STATIC_MODE = !LOCAL;
const API = location.port === "8080" ? "http://127.0.0.1:8000" : "";

const WARN = 75;     // amber: start moving people
const CRIT = 90;     // red: close enough to full that it needs acting on now
const ROUTING = 45;  // onward directions start being offered
const FULL = 99.5;   // rounds to 100% on screen, so treat it as full

const DEMO_START_HOUR = 26;
const LAST_HOUR = 144;
const TICK_MS = 2500;

const LETTERS = "ABCDEFGHIJ";

// The dashboard's sections, in page order, as the header lists them. Each has an
// element with id `${id}-section`.
const NAV_SECTIONS = [
  { id: "twin", label: "Digital Twin" },
  { id: "weather", label: "Weather" },
  { id: "social", label: "Social" },
  { id: "pressure", label: "Pressure" },
  { id: "venue", label: "Venue Floor" },
  { id: "capacity", label: "Capacity" },
  { id: "stays", label: "Stays" },
];

function bandColor(pct, hoursToSaturation) {
  if (pct >= CRIT) return "var(--accent)";
  if (hoursToSaturation != null && hoursToSaturation <= 4) return "var(--accent)";
  if (pct >= WARN) return "var(--warn)";
  if (hoursToSaturation != null && hoursToSaturation <= 12) return "var(--warn)";
  return "var(--good)";
}

function num(n) { return n == null ? "n/a" : n.toLocaleString(); }

/* Scroll a section to just under the sticky header. Timed rather than left to the
   browser's smooth scroll, which can stall while the 3D map is busy drawing: this
   always arrives, however slow the frames. The target is re-read every frame, so a
   panel that grows on the way does not throw it off. A wheel or touch hands control back. */
let scrollRun = 0;
function scrollToSection(el) {
  const run = ++scrollRun;
  const target = () => {
    const bar = document.querySelector(".topbar");
    const offset = bar && getComputedStyle(bar).position === "sticky" ? bar.offsetHeight + 18 : 12;
    const max = document.documentElement.scrollHeight - window.innerHeight;
    return Math.max(0, Math.min(max, el.getBoundingClientRect().top + window.scrollY - offset));
  };
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { window.scrollTo(0, target()); return; }
  const from = window.scrollY, start = performance.now(), dur = 550;
  const stop = () => { scrollRun++; };
  window.addEventListener("wheel", stop, { once: true, passive: true });
  window.addEventListener("touchstart", stop, { once: true, passive: true });
  const tick = (now) => {
    if (run !== scrollRun) return;
    const t = Math.min(1, (now - start) / dur), e = 1 - Math.pow(1 - t, 3);
    window.scrollTo(0, from + (target() - from) * e);
    if (t < 1) requestAnimationFrame(tick);
    else { window.removeEventListener("wheel", stop); window.removeEventListener("touchstart", stop); }
  };
  requestAnimationFrame(tick);
}
function dayLabel(h) { return `D${Math.floor(h / 24) + 1} · ${String(h % 24).padStart(2, "0")}:00`; }

/* Pressure map.
   Zones sit at their real coordinates as discs sized by hotel capacity, with
   occupancy read straight off the face. Transport links run underneath,
   coloured by load, so accommodation pressure and the routes feeding it read
   as one picture rather than two separate charts. */
function PressureMap({ zones, forecasts, transport, selected, onSelect, recs }) {
  if (!zones.length) return null;

  const W = 980, H = 340, PAD = 58;

  const lats = zones.map((z) => z.lat);
  const lngs = zones.map((z) => z.lng);
  const latMin = Math.min(...lats), latMax = Math.max(...lats);
  const lngMin = Math.min(...lngs), lngMax = Math.max(...lngs);

  // Latitude runs north but SVG y runs down, so y is inverted.
  const px = (lng) => PAD + ((lng - lngMin) / (lngMax - lngMin || 1)) * (W - PAD * 2);
  const py = (lat) => H - PAD - ((lat - latMin) / (latMax - latMin || 1)) * (H - PAD * 2);

  const fcById = Object.fromEntries(forecasts.map((f) => [f.zone_id, f]));
  const posById = Object.fromEntries(zones.map((z) => [z.id, { x: px(z.lng), y: py(z.lat) }]));

  const maxCap = Math.max(...zones.map((z) => z.hotel_capacity));
  const radius = (cap) => 15 + (cap / maxCap) * 15;

  const linkColor = (pct) =>
    pct >= 92 ? "var(--accent)" : pct >= 80 ? "var(--warn)" : "var(--line)";

  const saturated = zones.filter((z) => z.occupancy_pct >= CRIT).length;
  const filling = zones.filter((z) => z.occupancy_pct >= WARN && z.occupancy_pct < CRIT).length;

  // Only draw routes out of a zone that is filling enough to need them.
  const src = zones.find((z) => z.id === recs?.for_zone_id);
  const routeFrom = src && src.occupancy_pct >= ROUTING ? src.id : null;

  return (
    <div className="map">
      <svg viewBox={`0 0 ${W} ${H}`} role="img"
           aria-label="Map of zones showing current occupancy pressure">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                  markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)" />
          </marker>
          <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
            <path d="M 34 0 L 0 0 0 34" fill="none"
                  stroke="var(--line)" strokeWidth="1" strokeOpacity="0.5" />
          </pattern>
        </defs>
        <rect x="0" y="0" width={W} height={H} fill="url(#grid)" />

        {transport.map((l) => {
          const a = posById[l.from_zone], b = posById[l.to_zone];
          if (!a || !b) return null;
          const hot = l.load_pct >= 80;
          return (
            <line
              key={l.link_id}
              className="link"
              x1={a.x} y1={a.y} x2={b.x} y2={b.y}
              stroke={linkColor(l.load_pct)}
              strokeOpacity={(hot ? 0.8 : 0.3) * (routeFrom ? 0.45 : 1)}
              strokeWidth={hot ? 2 : 1.25}
            />
          );
        })}

        {/* Advised routes. Drawn only once the source zone is filling enough
            to warrant moving anyone, and ranked so the emptiest destination
            reads first. */}
        {routeFrom && recs?.options?.slice(0, 5).map((o, i) => {
          const a = posById[routeFrom];
          const b = posById[o.zone_id];
          if (!a || !b) return null;
          return (
            <g key={`route-${o.zone_id}`}>
              <line
                x1={a.x} y1={a.y} x2={b.x} y2={b.y}
                stroke="var(--accent)"
                strokeWidth={2}
                strokeOpacity={0.9}
                strokeDasharray="6 4"
                markerEnd="url(#arrow)"
              />
              <text
                className="rank"
                x={a.x + (b.x - a.x) * 0.55}
                y={a.y + (b.y - a.y) * 0.55 - 5}
                textAnchor="middle"
              >
                {i + 1}
              </text>
            </g>
          );
        })}

        {zones.map((z) => {
          const fc = fcById[z.id];
          const color = bandColor(z.occupancy_pct, fc?.hours_to_saturation);
          const p = posById[z.id];
          const r = radius(z.hotel_capacity);
          const isSel = selected === z.id;

          return (
            <g key={z.id} className="node" onClick={() => onSelect(z.id)}>
              {isSel && (
                <circle className="sel" cx={p.x} cy={p.y} r={r + 6} />
              )}
              <circle
                cx={p.x} cy={p.y} r={r}
                fill={color} fillOpacity={0.22}
                stroke={color} strokeWidth={z.is_venue_zone ? 2.5 : 1.5}
              />
              <text className="pctlabel" fill={color}
                    x={p.x} y={p.y + 4} textAnchor="middle">
                {z.occupancy_pct.toFixed(0)}%
              </text>
              <text className={`label${isSel ? " strong" : ""}`}
                    x={p.x} y={p.y + r + 15} textAnchor="middle">
                {z.name}
              </text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

// Where the demo starts. The Opening Ceremony runs at hours 30-33, and
// transport peaks as the crowd arrives and again on egress. Starting at 26
// leaves about ten seconds to introduce the screen before the first spike.

// Real milliseconds per simulated hour. Slow enough to read a change,
// fast enough that a demo reaches the peak without dead air.

/* What-if simulator.
   A recommendation says where to send people. This tests what happens if you
   actually do it: how far the source zone drops, where the visitors land, and
   whether the alert clears. Compliance is modelled because in practice not
   everyone follows guidance. */
// Preset disruption scenarios. Each is a real API call against real IDs
// from the generated dataset — the biggest scheduled event and the link
// connecting the stadium to South Market — not placeholders, so results
// change with the hour like everything else on the dashboard.
const SCENARIO_PRESETS = [
  { key: "cancel", label: "Cancel Semi Final now" },
  { key: "surge", label: "+10,000 surge on Semi Final" },
  { key: "close-link", label: "Close Stadium ↔ South Market link" },
];

function DisruptionScenarios({ hour }) {
  const [active, setActive] = useState(null);
  const [result, setResult] = useState(null);
  const [busy, setBusy] = useState(false);

  const run = async (key) => {
    setActive(key);
    setBusy(true);
    setResult(null);

    const url =
      key === "cancel" ? `${API}/scenarios/cancel/E5?hour=${hour}` :
      key === "surge" ? `${API}/scenarios/surge/E5?extra=10000&hour=${hour}` :
      `${API}/scenarios/close-link/L008?hour=${hour}`;

    try {
      const d = await fetch(url).then((r) => (r.ok ? r.json() : null));
      setResult(d);
    } catch (e) {
      setResult(null);
    } finally {
      setBusy(false);
    }
  };

  if (STATIC_MODE) {
    return (
      <div className="card">
        <div className="card-head">
          <h3 className="display">Disruption Scenarios</h3>
          <span className="meta">Needs the live API</span>
        </div>
        <div style={{ padding: "12px 18px 18px" }} className="empty">
          These run against the live backend and aren't precomputed into the
          static bundle. Run the API locally (see DEPLOY.md) to try them.
        </div>
      </div>
    );
  }

  return (
    <div className="card">
      <div className="card-head">
        <h3 className="display">Disruption Scenarios</h3>
        <span className="meta">What-if, at scale</span>
      </div>
      <div style={{ padding: "12px 18px 18px" }}>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 14 }}>
          {SCENARIO_PRESETS.map((s) => (
            <button
              key={s.key}
              onClick={() => run(s.key)}
              disabled={busy}
              style={{
                border: "1px solid var(--line, rgba(255,255,255,0.12))",
                borderRadius: 8, padding: "6px 12px", fontSize: 12.5, fontWeight: 600,
                cursor: "pointer", color: "var(--ink)",
                background: active === s.key ? "rgba(255,255,255,0.08)" : "transparent",
              }}>
              {s.label}
            </button>
          ))}
        </div>

        {busy && <div className="sk" style={{ height: 50 }} />}

        {!busy && result && active === "cancel" && (
          <div className="note">
            {result.already_admitted.toLocaleString()} already inside when cancelled &middot;
            egress {result.before.egress.hours_to_clear_zone}h [{result.before.egress.severity}]
            {" → "}
            {result.after.egress.hours_to_clear_zone}h [{result.after.egress.severity}]
            &middot; alerts {result.alerts_before} → {result.alerts_after}
          </div>
        )}

        {!busy && result && active === "surge" && (
          <div className="note">
            expected {result.before.expected_attendance.toLocaleString()} {"→"}{" "}
            {result.after.expected_attendance.toLocaleString()} &middot; turned away{" "}
            {result.before.turned_away.toLocaleString()} {"→"}{" "}
            {result.after.turned_away.toLocaleString()} &middot; ingress{" "}
            {result.before.ingress_severity} {"→"} {result.after.ingress_severity}
          </div>
        )}

        {!busy && result && active === "close-link" && (
          <div className="note">
            {result.from_zone} {"↔"} {result.to_zone}: {result.before.route.verdict}{" "}
            {"→"} {result.after.route.verdict}
            {result.after.route.summary ? ` — ${result.after.route.summary}` : ""}
          </div>
        )}

        {!busy && result && result.error && (
          <div className="note">{result.error}</div>
        )}
      </div>
    </div>
  );
}

function Simulator({ zoneId, zoneName, hour, sims }) {
  const [move, setMove] = useState(600);
  const [result, setResult] = useState(null);
  const [busy, setBusy] = useState(false);

  // Reset to a sensible default whenever the selected zone changes.
  useEffect(() => { setMove(600); setResult(null); }, [zoneId]);

  useEffect(() => {
    if (!zoneId) return;

    // Static mode already holds every slider position for this zone and hour,
    // so there is nothing to fetch and no debounce to wait through.
    if (sims) {
      setResult(sims[String(move)] || null);
      setBusy(false);
      return;
    }

    let cancelled = false;
    setBusy(true);

    const t = setTimeout(() => {
      fetch(`${API}/simulate/${zoneId}?move=${move}&hour=${hour}`)
        .then((r) => (r.ok ? r.json() : null))
        .then((d) => { if (!cancelled) { setResult(d); setBusy(false); } })
        .catch(() => { if (!cancelled) { setResult(null); setBusy(false); } });
    }, 180);

    return () => { cancelled = true; clearTimeout(t); };
  }, [zoneId, move, hour, sims]);

  if (!zoneId) return null;

  const src = result?.source;

  return (
    <div className="sect">
      <h3 className="display" style={{ margin: "6px 0 0" }}>Scenario Sim</h3>
      <div className="lead">
        What happens if you move visitors out of {zoneName}
      </div>

      <div className="sim-ctl">
        <div className="row">
          <span>Visitors to redirect</span>
          <span className="amt">{move.toLocaleString()}</span>
        </div>
        <input
          type="range" min="100" max="2500" step="100" value={move}
          onChange={(e) => setMove(Number(e.target.value))}
          aria-label="Number of visitors to redirect"
        />
      </div>

      {!result && busy && (
        <div className="sk" style={{ height: 74, marginBottom: 10 }} />
      )}

      {src && (
        <>
          <div className="outcome">
            <div className="shift">
              <span style={{ color: bandColor(src.occupancy_before_pct, null) }}>
                {src.occupancy_before_pct}%
              </span>
              <span className="arrow">to</span>
              <span style={{ color: bandColor(src.occupancy_after_pct, null) }}>
                {src.occupancy_after_pct}%
              </span>
            </div>
            <div className="note">
              {result.relocated.toLocaleString()} actually relocate.
              {" "}{result.stayed_put.toLocaleString()} ignore the guidance
              {result.unplaceable > 0
                ? `, ${result.unplaceable.toLocaleString()} have nowhere to go.`
                : "."}
            </div>
          </div>

          <div className={`verdict ${
            src.status_before === "ok" || result.alert_clears ? "clears" : "partial"
          }`}>
            {src.status_before === "ok"
              ? `${zoneName} is not under pressure yet. This would take it to ` +
                `${src.occupancy_after_pct}%, freeing capacity ahead of the next surge.`
              : result.alert_clears
                ? `The alert clears. ${zoneName} drops below the warning threshold.`
                : src.hours_to_saturation_after != null
                  ? `Not enough. ${zoneName} still saturates in about ${src.hours_to_saturation_after}h.`
                  : `Pressure eases but ${zoneName} stays above the warning threshold.`}
          </div>

          {result.placements.length > 0 && (
            <div>
              {result.placements.map((p) => (
                <div className="landing" key={p.zone_id}>
                  <span className="to">{p.zone_name}</span>
                  <span className="n">+{p.received.toLocaleString()}</span>
                  <span className="pc">
                    {p.occupancy_before_pct}% to {p.occupancy_after_pct}%
                  </span>
                </div>
              ))}
            </div>
          )}
        </>
      )}
    </div>
  );
}

/* Zone absorption grid.
   The map answers "where"; this answers "how much is left and which way is it
   moving". A tile per zone showing occupancy and its three-hour drift, so a
   zone filling fast reads differently from one sitting still at the same level.
   The zone with the most headroom is called out, since that is where arrivals
   should go next. */
function AbsorptionGrid({ zones, forecasts, selected, onSelect }) {
  if (!zones.length) {
    return (
      <div className="card">
        <div className="card-head"><h3 className="display">Spare Capacity</h3></div>
        <div className="grid-tiles">
          {Array.from({ length: 8 }).map((_, i) => (
            <div className="sk" key={i} style={{ height: 76 }} />
          ))}
        </div>
      </div>
    );
  }

  const fcById = Object.fromEntries(forecasts.map((f) => [f.zone_id, f]));

  const rows = zones.map((z, i) => {
    const fc = fcById[z.id];
    return {
      ...z,
      letter: LETTERS[i] || "?",
      spare: z.spare_capacity,
      trend: fc ? fc.trend_pct_per_hour : 0,
    };
  });

  // Emptiest by percentage, which is what the tiles actually display. Ranking
  // on absolute spare beds instead put the highlight on a large zone at 54%
  // while a small one sat at 27%, so the tile and its highlight disagreed.
  // Spare beds break ties between zones at the same occupancy.
  const best = [...rows].filter((r) => r.occupancy_pct < FULL)
    .sort((a, b) => (a.occupancy_pct - b.occupancy_pct) || (b.spare - a.spare))[0];

  const atRisk = rows.filter((r) => r.occupancy_pct >= WARN).length;
  const totalCap = rows.reduce((s, r) => s + r.hotel_capacity, 0);
  const cityLoad = totalCap
    ? Math.round(rows.reduce((s, r) => s + r.current_occupancy, 0) / totalCap * 100)
    : 0;

  const hottest = [...rows].sort((a, b) => b.occupancy_pct - a.occupancy_pct)[0];
  const catchers = [...rows]
    .filter((r) => r.id !== hottest.id && r.occupancy_pct < WARN)
    .sort((a, b) => a.distance_to_venue_km - b.distance_to_venue_km)
    .slice(0, 2);

  return (
    <div className="card navsec" id="capacity-section">
      <div className="card-head">
        <h3 className="display">Spare Capacity</h3>
        <span className="meta">Which zones can absorb overflow · {rows.length} zones</span>
      </div>

      <div className="grid-tiles">
        {rows.map((r) => {
          const isBest = best && r.id === best.id;
          const isHot = r.occupancy_pct >= CRIT;
          // Same band the map and chart use, so a zone never reads two ways.
          const band = r.occupancy_pct >= WARN ? "band-warn" : "band-ok";
          const fill = isHot ? " hot" : isBest ? " best" : ` ${band}`;
          return (
            <button
              key={r.id}
              className={`tile${r.id === selected ? " sel" : ""}${fill}`}
              onClick={() => onSelect(r.id)}
              title={`${r.name}: ${num(r.spare)} beds free`}
            >
              <span className="id">{r.letter}</span>
              <span className="pct">{r.occupancy_pct.toFixed(0)}</span>
              <div className="delta">
                {r.trend > 0 ? "+" : ""}{(r.trend * 3).toFixed(0)} / 3h
              </div>
              <div className="zname">{r.name}</div>
            </button>
          );
        })}
      </div>

      <div className="propagation">
        <span className="eyebrow dim">Propagation</span>
        <p>
          {catchers.length
            ? `If ${hottest.name} fills first, ${catchers.map((c) => c.name).join(" and ")} absorb the overflow, ${num(catchers.reduce((s, c) => s + c.spare, 0))} beds between them.`
            : `${hottest.name} is at ${hottest.occupancy_pct.toFixed(0)}% and every nearby zone is already past ${WARN}%.`}
          {" "}Grid load {cityLoad}%, {atRisk} zone{atRisk === 1 ? "" : "s"} at risk.
        </p>
      </div>
    </div>
  );
}

/* Places to stay, nearest first.
   Ranked only by distance from the visitor (or from the venue, until they share a
   location). There is no live room availability from the hotels, so nothing here
   says a place is filling up or how many rooms are left. */
const STAYS_SHOWN = 6;

function Stays({ hotels, pos, venues }) {
  const [all, setAll] = useState(false);
  const [geo, setGeo] = useState(() => EPLocate.get().status);
  useEffect(() => EPLocate.onChange((g) => setGeo(g.status)), []);

  if (!hotels.length) {
    return (
      <div className="stays-grid">
        {Array.from({ length: 3 }).map((_, i) => (
          <div className="stay-card" key={i}>
            <div className="sk" style={{ height: 22, width: "70%" }} />
            <div className="sk" style={{ height: 14, width: "50%", marginTop: 12 }} />
            <div className="sk" style={{ height: 40, marginTop: 18 }} />
          </div>
        ))}
      </div>
    );
  }

  const fromYou = !!pos;
  const ranked = fromYou
    ? EPLocate.rankHotels(hotels, pos.lat, pos.lng)
    : [...hotels].sort((a, b) => a.distance_to_venue_km - b.distance_to_venue_km)
        .map((h) => ({ hotel: h, km: h.distance_to_venue_km, minutes: h.travel_minutes, mode: "ride" }));
  const farthest = fromYou && ranked.length && ranked[0].km > 25;
  const shown = all ? ranked : ranked.slice(0, STAYS_SHOWN);
  const dist = (km) => (km < 1 ? `${Math.round(km * 100) * 10} m` : `${km.toFixed(1)} km`);
  const venueName = venues && venues.length ? venues[0].venue_name : "the venue";

  return (
    <>
      <div className="stays-head">
        <div>
          <span className="eyebrow">Places to stay</span>
          <h2 className="display" style={{ marginTop: 8 }}>{fromYou ? "Stays near you" : "Stays near the venue"}</h2>
          <div className="lead">
            {fromYou
              ? (farthest ? "You're outside the area we cover, so these are the closest we know of." : "Nearest first, from where you are now. The list follows you as you move.")
              : "Nearest to the main venue first. Share your location to sort them by distance from you instead."}
          </div>
        </div>
        {!fromYou && (geo === "off" || geo === "denied" || geo === "unavailable") && (
          <button className="stays-locate" onClick={() => EPLocate.start()}>
            <span className="youdot" aria-hidden="true" />Use my location
          </button>
        )}
        {!fromYou && geo === "asking" && <span className="meta">Finding you...</span>}
      </div>

      <div className="stays-grid">
        {shown.map((r, i) => {
          const h = r.hotel;
          return (
            <article className={`stay-card${i === 0 ? " first" : ""}`} key={h.hotel_id}>
              <div className="stay-top">
                <span className="stay-rank">{i === 0 ? (fromYou ? "Closest to you" : "Closest to the venue") : `#${i + 1}`}</span>
                <span className="rating" aria-label={`Rated ${h.rating.toFixed(1)} out of 5`}>{h.rating.toFixed(1)}&#9733;</span>
              </div>
              <h4>{h.name}</h4>
              <div className="zone-line">{h.zone_name}</div>
              <div className="stay-dist">
                <b>{dist(r.km)}</b>
                <span>{fromYou ? `from you · about ${r.minutes} min ${r.mode === "walk" ? "on foot" : "by car"}` : `from ${venueName}`}</span>
              </div>
              <div className="stay-foot">
                <span>{h.is_venue_zone ? "Walk to the venue" : `${h.travel_minutes} min to the venue`}</span>
                <span className="price">Rs {h.nightly_rate.toLocaleString()}<small> / night</small></span>
              </div>
            </article>
          );
        })}
      </div>
      {ranked.length > STAYS_SHOWN && (
        <button className="stays-more" onClick={() => setAll((v) => !v)}>
          {all ? "Show fewer" : `Show all ${ranked.length} stays`}
        </button>
      )}
    </>
  );
}


/* Next up.
   Occupancy rises because something is coming. Without the schedule on screen
   the dashboard shows pressure with no cause, and an operator has to already
   know the fixture list to read it. */
function NextUp({ data }) {
  if (!data?.schedule?.length) {
    return (
      <div className="sect">
        <span className="eyebrow">Schedule</span>
        <h3 className="display" style={{ marginTop: 7 }}>Next Up</h3>
        <div className="empty">Nothing further scheduled in this window.</div>
      </div>
    );
  }

  const band = (e) =>
    e.state === "running" ? "now" : e.hours_away <= 6 ? "soon" : "later";

  const when = (e) =>
    e.state === "running" ? "Underway" : `in ${e.hours_away}h`;

  return (
    <div className="sect">
      <span className="eyebrow">Schedule</span>
      <h3 className="display" style={{ marginTop: 7 }}>Next Up</h3>
      <div className="lead">What the pressure is building towards</div>

      {data.schedule.slice(0, 3).map((e) => (
        <div className="ev" key={e.event_id}>
          <div className="row1">
            <span className="nm">{e.name}</span>
            <span className={`cd ${band(e)}`}>{when(e)}</span>
          </div>
          <div className="row2">
            {e.zone_name} · {e.expected_attendance.toLocaleString()} expected
          </div>
        </div>
      ))}
    </div>
  );
}

function IncentivesPanel({ hour, staticData }) {
